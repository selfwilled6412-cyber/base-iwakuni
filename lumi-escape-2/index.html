<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c5eac"><title>ルミの脱出ミッションⅡ｜サイ校プロジェクト岩国</title><meta name="description" content="サイ校プロジェクト岩国の大型モニター対応・全4ステージの上級編謎解きゲーム"><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#172c53;background:radial-gradient(circle at top,#9adeff 0,#d9f1ff 35%,#f2f8ff 70%);min-height:100vh}.top{background:linear-gradient(105deg,#083d89,#0973c4);border-bottom:8px solid #ffcb3c;color:#fff;padding:15px clamp(12px,3vw,46px);display:flex;align-items:center;justify-content:space-between;gap:14px}.identity{display:flex;align-items:center;gap:13px}.identity img{width:130px;max-height:70px;object-fit:contain;background:white;padding:6px;border-radius:14px}.identity h1{font-size:clamp(23px,2.7vw,40px);line-height:1.2;margin:0}.sub{font-size:clamp(13px,1.4vw,21px);font-weight:750;margin:4px 0 0}.top a{color:#fff;font-weight:850;padding:9px 13px;border:2px solid #a8dfff;border-radius:13px;text-decoration:none}.content{width:min(1520px,100%);margin:auto;padding:clamp(12px,2vw,25px)}.screen{background:#fff;border:6px solid #b1dfff;border-radius:29px;box-shadow:0 14px 40px #073d7824;padding:clamp(16px,3vw,38px)}.hero{display:flex;align-items:center;gap:20px}.hero img{width:clamp(90px,11vw,160px);height:clamp(90px,11vw,160px);object-fit:cover;border:5px solid #d4e9ff;border-radius:24px}.heroTitle{font-size:clamp(27px,4.2vw,54px);font-weight:1000;line-height:1.26;margin:0 0 9px}.lead{font-size:clamp(17px,2.1vw,27px);line-height:1.65;font-weight:730}.startRibbon{color:#895208;font-size:clamp(15px,1.7vw,21px);font-weight:900;background:#ffefbb;border:3px solid #ffcb4b;border-radius:13px;padding:10px;margin-bottom:17px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:23px}.btn{border:3px solid transparent;border-radius:18px;padding:14px 21px;min-height:55px;cursor:pointer;font-weight:950;font-size:clamp(17px,1.8vw,25px);background:#edf4ff;color:#114a89}.btn.primary{background:#f83b43;color:white;box-shadow:0 6px #ad2735}.btn.gold{background:#ffce40;color:#654006;box-shadow:0 6px #bb8c18}.btn.navy{background:#1458a0;color:#fff}.btn:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:4px solid #ff9b00;outline-offset:4px}.track{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0 26px}.track span{padding:10px 13px;border:2px solid #c2dfff;background:#fff;border-radius:14px;font-weight:950;font-size:clamp(14px,1.4vw,20px)}.track .done{background:#d3ffdb;color:#116338;border-color:#79ce8d}.track .current{background:#ffdd70;border-color:#e4a928;color:#674100}.puzzle{border-radius:26px;border:5px solid #e8bc77;background:#fffcf3;padding:clamp(17px,2.4vw,31px);box-shadow:inset 0 0 0 5px #fff8e9}.pill{border-radius:50px;background:#e8f2ff;border:2px solid #aed4ff;display:inline-block;font-size:clamp(14px,1.3vw,20px);padding:7px 15px;font-weight:900;color:#1b5d9b}.puzzle h2{font-size:clamp(27px,3.2vw,48px);margin:15px 0 11px}.intro{font-weight:760;font-size:clamp(19px,2vw,29px);line-height:1.72;margin:6px 0 23px}.question{font-size:clamp(23px,2.4vw,36px);font-weight:1000;text-align:center;background:#fff0ba;border:3px dashed #e9c157;border-radius:16px;padding:13px;margin:20px 0 0}.chests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.chest{padding:15px 12px;background:#fff;border:3px solid #d5c5ad;border-radius:19px;min-height:145px;display:flex;align-items:center;flex-direction:column;gap:7px;text-align:center;font-weight:850;font-size:clamp(16px,1.6vw,24px)}.chestEmoji{font-size:clamp(36px,4vw,62px)}.chest span:last-child{line-height:1.45}.codeClues{display:grid;gap:10px}.codeRow{border:3px solid #d6e4fa;border-radius:15px;background:#fff;display:flex;align-items:center;gap:20px;padding:9px 13px}.codeRow strong{display:flex;gap:5px;flex-shrink:0}.codeRow strong span{display:grid;place-items:center;background:#173b72;color:#fff;border-radius:10px;font-size:clamp(24px,3vw,40px);width:clamp(39px,4.5vw,63px);height:clamp(43px,4.5vw,63px)}.codeRow p{font-size:clamp(16px,1.7vw,25px);font-weight:790;margin:0}.lineSlots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:760px;margin:15px auto}.lineSlots span{border:4px solid #abc8e9;background:#fff;border-radius:14px;display:grid;place-items:center;height:85px;font-size:32px;font-weight:1000}.lineSlots span.center{background:#ffe09d;border-color:#efa631}.clueList,.finalRules{display:grid;gap:10px;font-size:clamp(18px,2vw,30px);font-weight:800;line-height:1.4}.clueList>div,.finalRules>div{background:#fff;border:2px solid #dfd1b8;padding:12px;border-radius:13px}.names,.caseNote{background:#e4f4ff;padding:13px 17px;border-radius:13px;font-size:clamp(16px,1.7vw,25px);font-weight:800}.switches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.switches>div{border:3px solid var(--c);border-radius:18px;background:#fff;display:flex;align-items:center;flex-direction:column;font-size:38px;gap:3px;padding:15px}.switches strong{font-size:clamp(32px,3.5vw,55px)}.switches b{font-size:clamp(17px,2vw,26px)}.finalRules span{color:#006ecf;font-weight:1000}.codeSlots{display:flex;gap:16px;justify-content:center;margin:20px}.codeSlots span{background:#1c3d71;color:#ffde54;border-radius:12px;display:grid;place-items:center;width:clamp(55px,7vw,93px);height:clamp(65px,7vw,107px);font-size:clamp(39px,5vw,64px)}.hint{display:none;margin:20px 0 0;padding:18px;background:#fff0a7;border:4px solid #f4c544;border-radius:19px;font-size:clamp(18px,2.1vw,29px);line-height:1.6;font-weight:850}.hint.visible{display:block}.hint>strong{display:block;color:#a35100}.reveal{display:none;margin:18px 0 0;padding:22px;background:#e4ffe8;border:4px solid #58bb7d;border-radius:19px}.reveal.visible{display:block}.reveal h3{font-size:clamp(28px,3vw,43px);margin:0 0 7px;color:#075b31}.reveal p{font-size:clamp(17px,1.7vw,25px);line-height:1.65;margin:0}.status{font-size:17px;color:#44576b}.bannerEnd{background:#dffce5;border-radius:21px;border:4px solid #7cc987;padding:20px;font-weight:900;font-size:clamp(22px,3vw,34px)}@media(max-width:720px){.top{align-items:flex-start}.identity img{width:85px}.top a{font-size:13px}.chests{grid-template-columns:repeat(2,1fr)}.switches{grid-template-columns:repeat(2,1fr)}.codeRow{align-items:flex-start;flex-direction:column;gap:8px}.hero{align-items:flex-start}.hero img{width:90px;height:90px}.lineSlots{gap:4px}.lineSlots span{height:56px}.actions .btn{width:100%}.content{padding:8px}.screen{border-width:3px}.puzzle{border-width:3px}}.lineSlots.six{grid-template-columns:repeat(6,1fr);max-width:850px}.lampScene{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:930px;margin:12px auto}.lampScene>div{background:#fff;border:3px solid #bed7ef;padding:20px;border-radius:20px;text-align:center;font-size:clamp(17px,1.8vw,25px)}.lampGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:16px}.lampGrid>div{border-radius:16px;background:#d6e4f2;border:3px solid #aac1d6;display:grid;place-items:center;min-height:67px;font-size:clamp(27px,3vw,43px);font-weight:1000;color:#164479}.lampGrid.target .on{background:#ffda4d;border-color:#dda332;color:#7b4600;box-shadow:0 0 18px #f8c128a6}.lampGrid.target .off{background:#e8f0f9;color:#8aa9c1}.codeClues{max-width:1250px;margin:auto}@media(max-width:750px){.lampScene{grid-template-columns:1fr}.lampGrid>div{min-height:55px}.lineSlots.six span{font-size:21px}}</style></head><body><header class="top"><div class="identity"><img src="https://storage.googleapis.com/studio-design-asset-files/projects/V5a73rv7aR/s-1901x504_v-frms_webp_cf16287b-a688-4d6f-afad-af48e43834df_small.webp" alt="サイ校プロジェクトのロゴ" onerror="this.hidden=true"><div><h1>🕵️ ルミの脱出ミッションⅡ</h1><p class="sub">サイ校プロジェクト岩国｜新作・特別編</p></div></div><a href="../saiko-apps/">⌂ アプリ一覧へ</a></header><main class="content"><section id="welcome" class="screen"><div class="startRibbon">🔐 本格謎解き上級編Ⅱ・4ステージ</div><div class="hero"><img src="../assets/lumi-approved.webp" alt="案内役のルミ"><div><h2 class="heroTitle">新たな暗号の迷宮から脱出せよ！</h2><p class="lead">ルミからの挑戦状！ 3つの難問で手がかりを集め、最後の暗証番号を解読しよう。</p></div></div><p class="lead">利用者さんは画面を見て、ひとりずつスタッフに答えを伝えよう。ヒントと答えの発表はスタッフが操作。各部屋に3段階ヒント付き。</p><div class="actions"><button class="btn primary" id="start">🚀 最初の部屋から始める</button><button class="btn navy" id="resume" hidden>▶ 前回の続きから</button><a class="btn" style="text-decoration:none" href="staff.html" target="_blank" rel="noopener">📋 スタッフ専用カンペ</a></div><p class="status">※続きからの再開は、このブラウザ内に保存されます。人を交代するときはリセットできます。</p></section><section id="game" class="screen" hidden><div class="track" id="track"></div><article class="puzzle" id="puzzle"></article><div id="hint" class="hint" role="status" aria-live="polite"></div><div id="reveal" class="reveal" role="status" aria-live="polite"></div><div class="actions"><button id="speak" class="btn navy">🔊 ルミの読み上げ</button><button id="hintBtn" class="btn gold">💡 ヒント①を表示</button><button id="revealBtn" class="btn">✅ 正解を発表</button><button id="next" class="btn primary" disabled>➡ 次の部屋へ</button><button id="reset" class="btn">↺ 最初から</button><a class="btn" href="staff.html" target="_blank" rel="noopener" style="text-decoration:none">📋 カンペ</a></div></section></main><script>const CASES=[{"icon":"🔐","name":"第1の部屋｜封印された4桁の金庫","type":"条件をすべて満たす数字推理","intro":"暗証番号は4桁。0～9を使用し、同じ数字は2回使わない。先頭が0の可能性もある。5つの試行結果を全部満たす暗証番号は？","body":"<div class=\"codeClues\"><div class=\"codeRow\"><strong><span>8</span><span>9</span><span>4</span><span>3</span></strong><p>位置まで正しい数字が1個。残り3個は使わない。</p></div><div class=\"codeRow\"><strong><span>8</span><span>0</span><span>2</span><span>9</span></strong><p>正しい数字が2個。1個は位置も正しく、もう1個は位置が違う。</p></div><div class=\"codeRow\"><strong><span>9</span><span>5</span><span>1</span><span>7</span></strong><p>正しい数字は1個。位置は違う。</p></div><div class=\"codeRow\"><strong><span>7</span><span>1</span><span>9</span><span>0</span></strong><p>正しい数字は2個。1個は位置も正しく、もう1個は位置が違う。</p></div><div class=\"codeRow\"><strong><span>3</span><span>9</span><span>2</span><span>5</span></strong><p>正しい数字は1個。位置は違う。</p></div></div><div class=\"caseNote\">位置も正しい＝数字も場所も合っている／位置が違う＝数字はあるが別の場所。記載した個数は正確。</div>","q":"4桁の暗証番号は何？","answer":"7042","hints":["『8943』から、8・9・4・3のうち使う数字はちょうど1つで、しかも位置が合っている。","『8029』『7190』の情報も組み合わせ、使われない数字を先に消していこう。","答えには7・0・4・2が使われる。順番を特定して。"],"explain":"7042の場合、8943→4のみ位置一致。8029→0は位置一致・2は位置違い。9517→7のみ位置違い。7190→7が位置一致・0が位置違い。3925→2のみ位置違い。数字が重複しない4桁を全5040通り検証して唯一。"},{"icon":"🧍","name":"第2の部屋｜6人の記念写真","type":"位置関係・組合せ推理","intro":"6人が横一列に並んだ。全員が別の位置。下の7条件を全部満たす並び方は1通りだけ。左から4番目にいるのは誰？","body":"<div class=\"lineSlots six\"><span class=\"\">1</span><span class=\"\">2</span><span class=\"\">3</span><span class=\"center\">4</span><span class=\"\">5</span><span class=\"\">6</span></div><div class=\"clueList\"><div>① イオはオトより左にいる</div><div>② アオとイオの間には、ちょうど2人いる</div><div>③ アオとオトは隣り合わない</div><div>④ ウタはイオより左にいる</div><div>⑤ イオとカナは隣り合わない</div><div>⑥ エマとオトの間には、ちょうど2人いる</div><div>⑦ カナはウタより左にいる</div></div><p class=\"names\">6人：アオ・イオ・ウタ・エマ・オト・カナ</p>","q":"左から4番目の人は？","answer":"ウタ","hints":["『間に2人』は、両端の人の位置が3つ離れていること。まずその関係を紙に書こう。","アオとイオ、エマとオトの距離を先に決め、次にウタとカナの前後関係を確認しよう。","最後の並びは『カナ → アオ → エマ → ウタ → イオ → オト』。"],"explain":"全720通りの席順を条件①～⑦で照合した結果、カナ・アオ・エマ・ウタ・イオ・オトの1通り。4番目はウタ。"},{"icon":"💡","name":"第3の部屋｜9つの不思議なスイッチ","type":"反転パズル・空間推理","intro":"3×3のランプがすべて消えている。数字のボタンを1回押すと、その番号のランプと上下左右に隣接するランプが反転（点灯↔消灯）する。目標の光り方にするには、どのボタンを各1回押す？","body":"<div class=\"lampScene\"><div><strong>ボタン配置（1〜9）</strong><div class=\"lampGrid\"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div></div></div><div><strong>目標の点灯状態</strong><div class=\"lampGrid target\"><div class=\"off\">○</div><div class=\"off\">○</div><div class=\"off\">○</div><div class=\"on\">●</div><div class=\"off\">○</div><div class=\"off\">○</div><div class=\"on\">●</div><div class=\"off\">○</div><div class=\"on\">●</div></div></div></div><p class=\"caseNote\">反転：消灯なら点灯、点灯なら消灯。上下左右だけに影響する（斜めには影響しない）。各ボタンは0回か1回だけ押せる。</p>","q":"押すボタンの番号を全部答えてね。","answer":"1・4・5・9","hints":["角のボタンは、自分自身と隣り合う2か所だけが反転する。押す前と後の違いを図で確認して。","ボタン4は1・4・5・7、ボタン5は2・4・5・6・8に影響する。","1・4・5・9を1回ずつ押してみよう。"],"explain":"1,4,5,9を1回ずつ押すと4・7・9だけが点灯する。9ボタンの押す・押さないを全512通り確認して唯一の組合せ。"},{"icon":"🚪","name":"最後の部屋｜封印を解く4桁","type":"複数ステージの手がかり統合","intro":"最後の扉には4桁の番号が必要。前の3部屋で集めた答えを、4つの規則に変換して左から入力しよう。","body":"<div class=\"finalRules\"><div><span>①</span> 第1の部屋の暗証番号の千の位</div><div><span>②</span> 第2の部屋の4番目の人を番号に変換（アオ=1／イオ=2／ウタ=3／エマ=4／オト=5／カナ=6）</div><div><span>③</span> 第3の部屋で目標として光らせたランプの個数</div><div><span>④</span> 第3の部屋で押したボタンの個数</div></div><div class=\"codeSlots\"><span>?</span><span>?</span><span>?</span><span>?</span></div>","q":"最後の暗証番号は？","answer":"7334","hints":["第1の答えは7042、第2の答えはウタ。第3の答えは1・4・5・9。","7042の千の位は7、ウタは番号表で3。残る数字は点灯数と押下数。","光るランプは3つ、押したボタンは4つ。答えは7・3・3・4。"],"explain":"金庫7042の千の位=7。4番目のウタ=3。目標の点灯ランプは4・7・9の3個。押したボタンは1・4・5・9の4個。よって7334。"}];const K='saiko-escape-mission-v2';const byId=id=>document.getElementById(id);let step=0,hint=0,shown=false;let saved=null;try{saved=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(saved?.step>=0&&saved.step<CASES.length)byId('resume').hidden=false;const store=()=>{try{localStorage.setItem(K,JSON.stringify({step,hint,shown}))}catch(e){}};function speak(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let c=CASES[step];const u=new SpeechSynthesisUtterance(c.name+'。'+c.intro+'。'+c.q);u.lang='ja-JP';u.rate=.87;window.speechSynthesis.speak(u)}function paint(){const c=CASES[step];byId('welcome').hidden=true;byId('game').hidden=false;byId('track').innerHTML=CASES.map((x,i)=>'<span class="'+(i<step?'done':i===step?'current':'')+'">'+(i<step?'✓ ':i===step?'➤ ':'')+'第'+(i+1)+'の部屋</span>').join('');byId('puzzle').innerHTML='<span class="pill">'+c.type+'　｜　'+(step+1)+' / '+CASES.length+'</span><h2>'+c.icon+' '+c.name+'</h2><p class="intro">'+c.intro+'</p>'+c.body+'<div class="question">'+c.q+'</div>';byId('hint').className='hint'+(hint?' visible':'');byId('hint').innerHTML=hint?'<strong>💡 ヒント '+hint+' / 3</strong>'+c.hints[hint-1]:'';byId('reveal').className='reveal'+(shown?' visible':'');byId('reveal').innerHTML=shown?'<h3>🎉 答え：'+c.answer+'</h3><p>'+c.explain+'</p>':'';byId('hintBtn').textContent=hint<3?'💡 ヒント'+['①','②','③'][hint]+'を表示':'ヒントを全て表示済み';byId('hintBtn').disabled=hint>=3||shown;byId('revealBtn').disabled=shown;byId('next').disabled=!shown;byId('next').textContent=step===CASES.length-1?'🏆 ミッション達成！':'➡ 次の部屋へ';store()}function start(st){step=st;hint=0;shown=false;paint();speak()}byId('start').onclick=()=>start(0);byId('resume').onclick=()=>{step=saved.step;hint=saved.hint||0;shown=!!saved.shown;paint()};byId('speak').onclick=speak;byId('hintBtn').onclick=()=>{if(shown||hint>=3)return;hint++;paint()};byId('revealBtn').onclick=()=>{shown=true;paint();window.speechSynthesis?.cancel?.()};byId('reset').onclick=()=>{if(!confirm('最初の部屋からやり直しますか？'))return;window.speechSynthesis?.cancel?.();start(0)};byId('next').onclick=()=>{if(!shown)return;if(step===CASES.length-1){window.speechSynthesis?.cancel?.();byId('game').innerHTML='<div class="bannerEnd">🎉 脱出成功！ おめでとう！<br>ルミと4つの謎を解き明かしたよ！</div><div class="actions"><a class="btn primary" href="./">🔁 最初から遊ぶ</a><a class="btn navy" href="../saiko-apps/">他のゲームを見る</a></div>';try{localStorage.removeItem(K)}catch(e){}return;}step++;hint=0;shown=false;paint();speak()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!byId('game').hidden)byId('hintBtn').click()});</script></body></html>
