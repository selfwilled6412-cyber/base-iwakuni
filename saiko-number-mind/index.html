function updateSoundButton(){if(soundButton){soundButton.textContent=soundOn?'🔊 効果音ON':'🔇 効果音OFF';soundButton.setAttribute('aria-pressed',String(soundOn))}}
updateSoundButton();
function tone(type){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const notes=type==='win'?[523,659,784,1047]:type==='miss'?[392,349,293]:type==='flip'?[550]:[420,660];const now=ctx.currentTime;notes.forEach((f,i)=>{const osc=ctx.createOscillator(),vol=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(f,now+i*.1);vol.gain.setValueAtTime(.0001,now+i*.1);vol.gain.exponentialRampToValueAtTime(.12,now+i*.1+.02);vol.gain.exponentialRampToValueAtTime(.0001,now+i*.1+.19);osc.connect(vol);vol.connect(ctx.destination);osc.start(now+i*.1);osc.stop(now+i*.1+.2)});setTimeout(()=>ctx.close().catch(()=>{}),Math.ceil((notes.length+2)*100))}catch(e){}}
function finishReveal(){if(awarded)return;awarded=true;totalAccuracy+=accuracy;if(won)successes++;tone(won?'win':'miss')}
function printSheet(){return '<section class="printSheet" aria-label="配布用カード">'+entries.map(e=>'<div class="printCard"><strong>'+esc(e.name)+'</strong><b>'+e.num+'</b><small>数字はほかの人に見せないでね｜サイ校 数字の以心伝心</small></div>').join('')+'</section>'}

const panel=s=>'<section class="panel flash">'+s+'</section>';
const btn=(action,label,klass='')=>'<button type="button" class="btn '+klass+'" data-action="'+action+'">'+label+'</button>';
function pickTopic(){let pool=TOPICS.map((t,i)=>({...{category:t[0],title:t[1],low:t[2],high:t[3]},index:i})).filter(t=>(category==='all'||category===t.category)&&!usedTopics.includes(t.index));if(!pool.length){usedTopics=[];pool=TOPICS.map((t,i)=>({category:t[0],title:t[1],low:t[2],high:t[3],index:i})).filter(t=>category==='all'||category===t.category)}topic=pool[randomInt(pool.length)];usedTopics.push(topic.index)}
function newDeal(){const numbers=shuffle(Array.from({length:100},(_,i)=>i+1)).slice(0,players.length);entries=players.map((name,i)=>({id:i,name,num:numbers[i],clue:''}));dealAt=0;revealed=0;awarded=false;accuracy=0;pickTopic();phase='deal'}
function topicHtml(){return '<div class="topic"><small>🎲 '+esc(topic.category)+' のお題</small><strong>'+esc(topic.title)+'</strong><div class="scale"><span>🧊 1：'+esc(topic.low)+'</span><span>🔥 100：'+esc(topic.high)+'</span></div></div>'}
function render(){
 if(phase==='setup'){
  const countSaved=Number(saved.count);const roundSaved=Number(saved.rounds);
  app.innerHTML=panel('<h2>🎮 みんなで挑戦！</h2><div class="pills"><span class="pill">👥 2〜20人</span><span class="pill">🃏 1〜100で重複なし</span><span class="pill">🤝 全員で協力</span><span class="pill">🎉 '+TOPICS.length+'お題</span></div><p style="text-align:center">みんなには秘密の数字が1つずつ配られるよ！<br>数字を言わずにヒントを出して、小さい順に並べられるかな？</p><div class="setupGrid"><div class="field"><label for="count">参加人数</label><select id="count">'+Array.from({length:19},(_,i)=>i+2).map(n=>'<option value="'+n+'"'+(n===(countSaved>=2&&countSaved<=20?countSaved:6)?' selected':'')+'>'+n+'人</option>').join('')+'</select></div><div class="field"><label for="rounds">ラウンド数</label><select id="rounds">'+Array.from({length:10},(_,i)=>i+1).map(n=>'<option value="'+n+'"'+(n===(roundSaved>=1&&roundSaved<=10?roundSaved:3)?' selected':'')+'>'+n+'回</option>').join('')+'</select></div><div class="field"><label for="category">お題ジャンル</label><select id="category"><option value="all">全部ランダム 🎉</option>'+['おもしろ','動物','食べ物','日常','趣味'].map(n=>'<option value="'+n+'"'+(saved.category===n?' selected':'')+'>'+n+'</option>').join('')+'</select></div><div class="field wide"><label for="names">参加者の名前（任意・1行に1人ずつ）</label><textarea id="names" placeholder="例：たろう&#10;はなこ&#10;じろう"></textarea><span style="font-size:13px;color:#d5ccf7">人数より名前が少なければ、残りは「プレイヤー○」になるよ。名前は保存しません。</span></div></div><p class="note">🔒 数字は本人だけの秘密！スマホを順番に回す方法と、カードを印刷して配る方法を選べるよ。<strong>秘密カードの配布中は大画面投影・画面共有を停止</strong>してね。</p><div class="buttons">'+btn('start','🚀 ゲームスタート！','primary')+'</div>');
  return;
 }
 const completedRounds=round-1+(phase==='result'&&awarded?1:0);const progress='<div class="progress">ROUND '+round+' / '+rounds+'　★ 全員成功 '+successes+'回'+(completedRounds>0?'　★ 平均一致率 '+Math.round(totalAccuracy/completedRounds)+'%':'')+'</div>';
 if(phase==='deal'){
  const e=entries[dealAt];
  app.innerHTML=progress+panel('<h2>🔒 秘密の数字を配ろう</h2>'+topicHtml()+'<p class="privacy">⚠️ 配布中は画面の投影・共有を必ず止めてね！<br>スマホを次の人だけに渡して、数字を確認してもらおう。</p><div class="secretBox"><div class="secretOwner">'+esc(e.name)+' さんの番　('+(dealAt+1)+' / '+entries.length+')</div><div id="cardBack" class="cardBack">🃏❔</div><div id="secret" class="secretNumber" hidden>'+e.num+'</div><div class="buttons"><button id="peek" class="btn primary" type="button" data-action="peek">👀 自分だけ数字を見る</button><button id="next" class="btn secondary" type="button" data-action="next" hidden>🔒 数字を隠して'+(dealAt===entries.length-1?'並べ替えへ':'次の人へ')+' ▶</button></div></div><p class="tip">数字を覚えたら必ず隠してね。ヒントを話すのは全員に配り終わってから！</p><div class="printHint"><strong>🖨️ 紙のカードを配りたいスタッフはこちら</strong><p>配布用カードをA4に印刷（またはPDF保存）できます。印刷プレビューに全員の数字が出るので、<b>画面共有は切ってから</b>操作してね。</p><div class="buttons">'+btn('print','🖨️ 配布カードを印刷','secondary')+btn('skipDeal','✅ 全員に配布したので開始','secondary')+'</div></div>')+printSheet();
  return;
 }
 if(phase==='play'){
  app.innerHTML=progress+panel('<h2>🎤 ヒントで相談しよう！</h2>'+topicHtml()+'<p class="tip">みんなのヒントを入力。▲▼または「移動先」の数字で、小さいと思う順に並べてね。<b>数字そのものは言わないで！</b></p><div class="clueList">'+entries.map((e,i)=>'<div class="clue"><span class="place">'+(i+1)+'</span><div><div class="person">'+esc(e.name)+'</div><input data-id="'+e.id+'" aria-label="'+esc(e.name)+'のヒント" placeholder="例：ライオン" maxlength="100" value="'+esc(e.clue)+'"></div><div class="orderActions"><span class="orderLabel">移動先</span><select class="orderSelect" data-move-id="'+e.id+'" aria-label="'+esc(e.name)+'の移動先">'+entries.map((x,j)=>'<option value="'+j+'"'+(i===j?' selected':'')+'>'+(j+1)+'番目</option>').join('')+'</select><div class="move"><button type="button" data-action="up" data-id="'+e.id+'" aria-label="'+esc(e.name)+'を上へ" '+(i===0?'disabled':'')+'>▲</button><button type="button" data-action="down" data-id="'+e.id+'" aria-label="'+esc(e.name)+'を下へ" '+(i===entries.length-1?'disabled':'')+'>▼</button></div></div></div>').join('')+'</div><p class="tip" id="error" role="status"></p><div class="buttons">'+btn('newTopic','🎲 お題を変える','secondary')+btn('reveal','🎬 ドキドキ答え合わせ！','primary')+'</div>');
  return;
 }
 if(phase==='result'){
  const finished=revealed===entries.length,sorted=entries.slice().sort((a,b)=>a.num-b.num),final=round===rounds;
  const cover=finished?(won?'🎊 全員正解！ おめでとう！':'💫 惜しい！ ここが逆だった！'):'ドキドキ… いよいよ答え合わせ！';
  app.innerHTML=progress+panel('<div class="curtain"><strong>'+cover+'</strong><p>'+(finished?'全員の数字を公開したよ！':'カードを1枚ずつ開けて、みんなで予想しよう！')+'</p></div>'+topicHtml()+'<div class="revealAmount">🃏 '+revealed+' / '+entries.length+' 枚オープン！</div><div class="results">'+entries.map((e,i)=>'<div class="resultItem '+(i<revealed&&i>0&&entries[i-1].num>e.num?'out ':'')+(i===revealed-1?'newly':'')+'"><div class="number '+(i>=revealed?'mask':'')+'">'+(i<revealed?e.num:'❔')+'</div><div><strong>'+(i+1)+'. '+esc(e.name)+'</strong><p>💬 '+esc(e.clue)+'</p>'+(i<revealed&&i>0&&entries[i-1].num>e.num?'<span class="outmark">⚠️ ここで逆転！</span>':'')+'</div></div>').join('')+'</div>'+(finished?'<div class="judge '+(won?'good':'bad')+'">🎯 順番の一致率 '+accuracy+'%</div>'+(won?'<p class="correct">✨ 順番は全員正解！ 最強のチームワーク！</p>':'<p class="correct">💡 正解順：'+sorted.map(e=>esc(e.name)+'（'+e.num+'）').join(' → ')+'</p>')+'<div class="score">🏆 '+round+'ラウンド中 '+successes+'回 全員成功！<br><span class="avg">平均一致率 '+Math.round(totalAccuracy/round)+'%</span></div>':'<p class="tip">数字を見て「えーっ！」と盛り上がろう！</p>')+(finished&&final?'<p class="tip">🎉 全ラウンド終了！ おつかれさま！</p>':'')+'<div class="buttons">'+(finished?(btn(final?'again':'nextRound',final?'🔄 最初からもう一度':'➡️ 次のラウンドへ','primary')+btn('again','⌂ 設定に戻る','secondary')):(btn('flip','🃏 次の数字をオープン！','primary')+btn('flipAll','⚡ 残り全部オープン','secondary')))+'</div>');
  return;
 }
}

function start(){
 const count=Number(document.getElementById('count').value);
 rounds=Number(document.getElementById('rounds').value);
 category=document.getElementById('category').value;
 const names=document.getElementById('names').value.split(/\r?\n/).map(s=>s.trim().slice(0,40)).filter(Boolean);
 players=Array.from({length:count},(_,i)=>names[i]||'プレイヤー'+(i+1));
 round=1;successes=0;totalAccuracy=0;usedTopics=[];
 saved={count,rounds,category,soundOn};savePrefs(count,rounds,category);
 newDeal();render();tone('tap');
}
function submit(){
 const empty=entries.find(e=>!e.clue.trim());
 if(empty){const el=document.getElementById('error');el.textContent='⚠️ '+empty.name+'さんのヒントを入力してね！';document.querySelector('input[data-id="'+empty.id+'"]')?.focus();return}
 const pairs=entries.length*(entries.length-1)/2;
 let good=0;
 for(let i=0;i<entries.length;i++)for(let j=i+1;j<entries.length;j++)if(entries[i].num<entries[j].num)good++;
 accuracy=Math.round(good*100/pairs);
 won=good===pairs;revealed=0;awarded=false;phase='result';render();tone('tap');
}
document.addEventListener('input',e=>{
 if(e.target.matches('input[data-id]')){
  const found=entries.find(x=>x.id===Number(e.target.dataset.id));
  if(found)found.clue=e.target.value;
 }
});
document.addEventListener('change',e=>{
 if(!e.target.matches('select[data-move-id]'))return;
 const id=Number(e.target.dataset.moveId),from=entries.findIndex(x=>x.id===id),target=Number(e.target.value);
 if(phase!=='play'||from<0||target<0||target>=entries.length||!Number.isInteger(target))return;
 const [entry]=entries.splice(from,1);entries.splice(target,0,entry);render();tone('flip');
});
document.addEventListener('click',e=>{
 const button=e.target.closest('[data-action]');if(!button)return;
 const action=button.dataset.action;
 if(action==='sound'){soundOn=!soundOn;updateSoundButton();try{localStorage.setItem(settingsKey,JSON.stringify({...saved,soundOn}))}catch(e){}if(soundOn)tone('tap');return}
 if(action==='fullscreen'){const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});return}
 if(action==='start'){start();return}
 if(action==='peek'){document.getElementById('secret').hidden=false;document.getElementById('cardBack').hidden=true;document.getElementById('peek').hidden=true;document.getElementById('next').hidden=false;return}
 if(action==='next'){document.getElementById('secret').hidden=true;dealAt++;if(dealAt>=entries.length)phase='play';render();return}
 if(action==='print'){if(typeof window.print==='function')window.print();return}
 if(action==='skipDeal'){phase='play';render();return}
 if(action==='up'||action==='down'){
  if(phase!=='play')return;
  const i=entries.findIndex(x=>x.id===Number(button.dataset.id)),j=i+(action==='up'?-1:1);
  if(i<0||j<0||j>=entries.length)return;
  [entries[i],entries[j]]=[entries[j],entries[i]];render();tone('flip');return;
 }
 if(action==='newTopic'&&phase==='play'){pickTopic();render();tone('flip');return}
 if(action==='reveal'&&phase==='play'){submit();return}
 if(action==='flip'&&phase==='result'&&revealed<entries.length){
  revealed++;if(revealed===entries.length)finishReveal();else tone('flip');render();return;
 }
 if(action==='flipAll'&&phase==='result'){revealed=entries.length;finishReveal();render();return}
 if(action==='nextRound'&&phase==='result'&&revealed===entries.length){round++;newDeal();render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(action==='again'){phase='setup';render();window.scrollTo({top:0,behavior:'smooth'});return}
});

render();
})();
</script>
</body>
</html>
