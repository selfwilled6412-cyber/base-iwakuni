plugins { id 'com.android.application' }

android {
    namespace 'jp.base.saikobeat'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.base.saikobeat'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-native-wav-qa'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
    debugImplementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.5'
    debugImplementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
