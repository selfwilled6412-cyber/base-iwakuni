問題画面に表示されるID（例：E01 / M07 / H30）で検索できます。</p></div><main class="wrap"><p><a href="index.html" style="font-weight:900;color:#1760a6">← 問題アプリへ戻る</a></p><div class="tools"><select id="level"><option value="all">全難易度</option><option value="2">初級30問</option><option value="3">中級30問</option><option value="5">上級30問</option></select><input id="keyword" placeholder="問題ID・タイトルで検索（例：H12）"><button id="clear">クリア</button><button class="print" onclick="window.print()">🖨️ 印刷</button></div><div class="result" id="count"></div><div id="items"></div><p class="foot">大画面で操作するのはスタッフのみ。個人回答を直接聞き、ヒントは必要な場合だけ段階的に提示。</p></main><script>const Q=[{"key":"E01","id":1,"level":2,"title":"写真の中の4文字","category":"季節 × 文字抜き出し","subtitle":"4枚の写真が表す行事名をひらがなにし、♥の数字番目を①〜④の順に読もう。","answer":"いんさつ","hints":["日付はそれぞれ何の行事の日？","①ほわいとでー、②はろうぃん、③しちごさん、④ひなまつり。","それぞれ3・5・4・4文字目を拾う。"],"explain":"ほわいとでーの3番目「い」、はろうぃんの5番目「ん」、しちごさんの4番目「さ」、ひなまつりの4番目「つ」。順に読むと「いんさつ」。","speech":"写真の中の4文字。4枚の写真が表す行事名をひらがなにし、♥の数字番目を①〜④の順に読もう。 答えがわかったら、スタッフに教えてね。","unit":"ひらがな4文字"},{"key":"M01","id":1,"level":3,"title":"たぬきからの手紙","category":"ことばの暗号","subtitle":"送り主は「たぬき」。手紙に書かれた、本当のメッセージは？","answer":"ほしぞら","hints":["送り主の名前そのものがヒント。","「た・ぬき」を別の言い方で考えて。","手紙から「た」を全部抜く。"],"explain":"「た」を抜くと「ほしぞら」。たぬき＝「た」抜き、という言葉遊び。","speech":"たぬきからの手紙。送り主は「たぬき」。手紙に書かれた、本当のメッセージは？ 答えがわかったら、スタッフに教えてね。","unit":"ひらがな4文字"},{"key":"M02","id":2,"level":3,"title":"4組の共通文字を探せ","category":"観察 × 共通文字","subtitle":"各組の2つの言葉で、共通している文字が1文字だけ。①〜④をつなげると？","answer":"さいこう","hints":["①の「かさ」と「さとう」を比べよう。","どの組にも重複する文字は1文字だけ。","①さ、②い、③こ、④う。"],"explain":"①さ、②い、③こ、④う。上から読んで「さいこう」。","speech":"4組の共通文字を探せ。各組の2つの言葉で、共通している文字が1文字だけ。①〜④をつなげると？ 答えがわかったら、スタッフに教えてね。","unit":"ひらがな4文字"},{"key":"M03","id":3,"level":3,"title":"1枚だけ本当の札","category":"真偽 × 宝箱","subtitle":"A・B・Cの箱のどれかに宝物。3枚の札のうち、本当のことを書いた札はちょうど1枚。","answer":"B","hints":["Aにあると仮定して、どの札が本当？","次はBにあると仮定して数えよう。","本当の札が1枚になるのはBだけ。"],"explain":"AならBとCが本当（2枚）。BならAだけ本当（1枚）。CならAとBが本当（2枚）。正解はB。","speech":"1枚だけ本当の札。A・B・Cの箱のどれかに宝物。3枚の札のうち、本当のことを書いた札はちょうど1枚。 答えがわかったら、スタッフに教えてね。","unit":"箱のアルファベット"},{"key":"E02","id":2,"level":2,"title":"フルーツの数字暗号","category":"計算 × 置き換え","subtitle":"同じ果物は同じ数字を表す。最後の？はいくつ？","answer":"15","hints":["最初の式から🍎1個はいくつ？","🍎が6なら、🍌は4。","🍇は5。あとは3つを足そう。"],"explain":"🍎＝6、🍌＝4、🍇＝5。6＋4＋5＝15。","speech":"フルーツの数字暗号。同じ果物は同じ数字を表す。最後の？はいくつ？ 答えがわかったら、スタッフに教えてね。","unit":"数字で答える"},{"key":"H01","id":1,"level":5,"title":"金庫を開ける、5枚の手がかり","category":"暗号・消去法","subtitle":"5枚のメモを同時に満たす3桁の暗証番号は？\n数字はすべて異なり、先頭は0ではありません。","answer":"574","hints":["まず「219」はすべて使わない。1・2・9を候補から消してみて。","「173」は数字も場所も合うものがちょうど1つ。「357」は2つの数字が含まれるけれど位置は両方違う。","「479」は1つが正しい位置、もう1つは違う位置。全部照合すると 5・7・4 の順。"],"explain":"5行の「数字と位置が両方正しい個数／数字だけ正しい個数」をすべて同時に満たす、数字が重複しない3桁の番号は574だけ。219の数字は不使用、173では真ん中の7が正位置、915では5が位置違い、357では5と7が位置違い、479では7が正位置・4が位置違い。","speech":"金庫を開ける、5枚の手がかり。5枚のメモを同時に満たす3桁の暗証番号は？\n数字はすべて異なり、先頭は0ではありません。 答えがわかったら、スタッフに教えてね。","unit":"数字3桁"},{"key":"M04","id":4,"level":3,"title":"4人が並ぶ順番は？","category":"条件整理 × 席順","subtitle":"左から並んだ4人の順番を決めて、左から2番目の人を答えよう。","answer":"みどり","hints":["しろの位置をまず決めよう。","あおい→みどり、の2人は隣同士。","きいはみどりより右で、しろは一番右。"],"explain":"唯一の並びは「あおい・みどり・きい・しろ」。2番目は「みどり」。","speech":"4人が並ぶ順番は？。左から並んだ4人の順番を決めて、左から2番目の人を答えよう。 答えがわかったら、スタッフに教えてね。","unit":"ひらがな3文字"},{"key":"M05","id":5,"level":3,"title":"行き止まりだらけの暗号迷路","category":"迷路・文字収集","subtitle":"左上のSTARTから右下のGOALへ。\n右か下に1マスだけ動けます。■は通行禁止。通った★の文字を順に読もう。","answer":"あんごう","hints":["右か下にしか動けないから、近道でも左や上には戻れないよ。","STARTから最初は下へ。通れる道を一手先まで見て進もう。","唯一の正しい道は、下→右→右→下→右→右→下→下。通る★をつなげてみて。"],"explain":"STARTからGOALへは「下→右→右→下→右→右→下→下」の経路だけ。途中の★にある「あ」「ん」「ご」「う」を順に読むと「あんごう」。画面の別ルートにある★は通らない。","speech":"行き止まりだらけの暗号迷路。左上のSTARTから右下のGOALへ。\n右か下に1マスだけ動けます。■は通行禁止。通った★の文字を順に読もう。 答えがわかったら、スタッフに教えてね。","unit":"ひらがな4文字"},{"key":"E03","id":3,"level":2,"title":"高さの違う4本の旗","category":"観察 × 並べ替え","subtitle":"旗を高さが高い順に並べ、旗に書かれたひらがなを読もう。","answer":"おたから","hints":["旗の高さだけに注目してね。","高い旗から低い旗に順番をつけよう。","高い順は、お→た→か→ら。"],"explain":"旗の高さは「お」4、「た」3、「か」2、「ら」1。高い順に「おたから」と読む。","speech":"高さの違う4本の旗。旗を高さが高い順に並べ、旗に書かれたひらがなを読もう。 答えがわかったら、スタッフに教えてね。","unit":"ひらがな4文字"},{"key":"M06","id":6,"level":3,"title":"1文字前に戻す暗号","category":"ひらがな × 規則発見","subtitle":"文字を五十音の並びで1文字だけ「前」に戻す暗号。次の3文字を解読しよう。","answer":"ひみつ","hints":["上の例はどれも五十音で次の文字に進んでいる。","戻すときは1つ前の文字へ。","ふ→ひ、む→み、て→つ。"],"explain":"五十音の清音を順にたどって暗号化している。逆に1文字戻すと「ふ→ひ、む→み、て→つ」で「ひみつ」。","speech":"1文字前に戻す暗号。文字を五十音の並びで1文字だけ「前」に戻す暗号。次の3文字を解読しよう。 答えがわかったら、スタッフに教えてね。","unit":"ひらがな3文字"},{"key":"E04","id":4,"level":2,"title":"時計が示す順番","category":"時計 × 文字並べ替え","subtitle":"時刻が早いものから順番に、カードの文字を読もう。","answer":"ほんだな","hints":["いちばん早い時計を探してね。","7:50→8:10→9:30→10:45。","早い順のひらがなを読もう。"],"explain":"7:50は「ほ」、8:10は「ん」、9:30は「だ」、10:45は「な」。答えは「ほんだな」。","speech":"時計が示す順番。時刻が早いものから順番に、カードの文字を読もう。 答えがわかったら、スタッフに教えてね。","unit":"ひらがな4文字"},{"key":"M07","id":7,"level":3,"title":"逆向きの座標暗号","category":"座標 × 逆読み","subtitle":"横がA〜D、縦が1〜4。指定されたマスを読む。ただし矢印は「←」！","answer":"まほう","hints":["A1などは、列のアルファベットと行の数字だよ。","矢印「←」なので、読む順番は右から左。","B2→D3→A1の順に調べよう。"],"explain":"B2は「ま」、D3は「ほ」、A1は「う」。右から読むので「まほう」。","speech":"逆向きの座標暗号。横がA〜D、縦が1〜4。指定されたマスを読む。ただし矢印は「←」！ 答えがわかったら、スタッフに教えてね。","unit":"ひらがな3文字"},{"key":"H02","id":2,"level":5,"title":"本当のことを言う札は2枚","category":"うそ・消去法","subtitle":"宝石はA・B・C・Dのどれか1箱に入っています。\n4枚の札のうち、本当のことが書いてある札はちょうど2枚。宝石はどこ？","answer":"C","hints":["宝石をAに置いた場合、4枚の札は何枚正しくなるか考えよう。","Aなら正しい札3枚、Bなら1枚、Dなら3枚になるよ。","Cにあると、②と④の札だけが本当になる。"],"explain":"宝石がAなら本当3枚、Bなら1枚、Cなら2枚、Dなら3枚。ちょうど2枚になるのはCのときだけ。","speech":"本当のことを言う札は2枚。宝石はA・B・C・Dのどれか1箱に入っています。\n4枚の札のうち、本当のことが書いてある札はちょうど2枚。宝石はどこ？ 答えがわかったら、スタッフに教えてね。","unit":"A〜Dのアルファベット"},{"key":"M08","id":8,"level":3,"title":"マークに隠れた計算法則","category":"図形 × 論理","subtitle":"同じマークには同じ数。すべての式が成り立つとき、最後の？は？","answer":"31","hints":["3つの式をすべて足すと、各マークが2個ずつになる。","◆＋●＋▲＝16。各マークの値を求めよう。","◆＝7、●＝4、▲＝5。最後は7×5－4。"],"explain":"3式を足すと各マーク2個で32。合計は16。◆＝16－9＝7、●＝16－12＝4、▲＝16－11＝5。7×5－4＝31。","speech":"マークに隠れた計算法則。同じマークには同じ数。すべての式が成り立つとき、最後の？は？ 答えがわかったら、スタッフに教えてね。","unit":"数字で答える"},{"key":"H03","id":3,"level":5,"title":"5人の席順を見破れ！","category":"条件整理・論理","subtitle":"5人は横一列に並んでいます。\n5つの条件をすべて満たすとき、真ん中（左から3番目）は誰？","answer":"さき","hints":["「〜より左」の2条件から、れん → さき → みお の順番になるよ。","れんとさきは隣ではない。さきとみおも隣ではない。間に別の人が必要だね。","れん・あおい・さき・ゆう・みお、の順にしか並べない。真ん中は？"],"explain":"条件をすべて満たす唯一の並びは、左から「れん・あおい・さき・ゆう・みお」。中央は「さき」。5つの条件はいずれも候補を減らすために必要。","speech":"5人の席順を見破れ！。5人は横一列に並んでいます。\n5つの条件をすべて満たすとき、真ん中（左から3番目）は誰？ 答えがわかったら、スタッフに教えてね。","unit":"ひらがな2文字"},{"key":"E05","id":5,"level":2,"title":"鏡の国のメッセージ","category":"逆読み × ひらめき","subtitle":"鏡の向こうから手紙が届いた！左右逆から読むと、何になる？","answer":"とけい","hints":["鏡の文字は逆から読むことが多いね。","最後の文字から最初へ読もう。","と→け→い。"],"explain":"「いけと」を右から左へ読むと「とけい」。","speech":"鏡の国のメッセージ。鏡の向こうから手紙が届いた！左右逆から読むと、何になる？ 答えがわかったら、スタッフに教えてね。","unit":"ひらがな3文字"},{"key":"M09","id":9,"level":3,"title":"3人の証言が一致する扉","category":"証言 × 消去法","subtitle":"出口の扉はA・B・Cのどれか。3人の発言がすべて正しいのは、どの扉？","answer":"B","hints":["3人の言葉を同時に満たす場所を探そう。","案内役はAではない、博士はCではないと言っている。","残る場所はB。ロボの発言も確かめよう。"],"explain":"Aなら案内役とロボが間違い。Cならロボと博士が間違い。Bなら3人とも正しい。唯一の答えはB。","speech":"3人の証言が一致する扉。出口の扉はA・B・Cのどれか。3人の発言がすべて正しいのは、どの扉？ 答えがわかったら、スタッフに教えてね。","unit":"扉のアルファベット"},{"key":"H04","id":4,"level":5,"title":"最後の1枚、図形の法則","category":"図形・パターン推理","subtitle":"9つのタイルには同じ法則があります。\n右下に入るのはA・B・C・Dのどれ？ 左右も上下も同じ法則です。","answer":"C","hints":["上段の左2枚と、いちばん右のタイルを比べてね。黒丸が増えるだけとは限らないよ。","左と中央の同じ場所にある黒丸は消え、片方にだけある黒丸は残るよ。","下段の左と中央を同じ規則で重ねてみよう。右下の形はC。"],"explain":"同じ行の左タイルと中央タイルを重ね、同じ場所で重なる黒丸は消す。片方にだけある黒丸が右タイルに残る（排他的論理和）。列でも同じ。右下の正しい黒丸配置を持つのはCだけ。","speech":"最後の1枚、図形の法則。9つのタイルには同じ法則があります。\n右下に入るのはA・B・C・Dのどれ？ 左右も上下も同じ法則です。 答えがわかったら、スタッフに教えてね。","unit":"選択肢A〜D"},{"key":"M10","id":10,"level":3,"title":"4枚の番号付きカード","category":"文字抜き出し × 規則","subtitle":"4枚のカードに書かれた文字のうち、右下の数字番目を順に抜き出そう。","answer":"ごうかく","hints":["文字数ではなく、♥の数字が順番を示しているよ。","①「いちご」の3番目は「ご」。","順に「ご」「う」「か」「く」。"],"explain":"いちご③＝ご、ふうせん②＝う、すいか③＝か、ふくろう②＝く。つないで「ごうかく」。","speech":"4枚の番号付きカード。4枚のカードに書かれた文字のうち、右下の数字番目を順に抜き出そう。 答えがわかったら、スタッフに教えてね。","unit":"ひらがな4文字"},{"key":"E06","id":6,"level":2,"title":"赤いハートの文字を集めろ！ 1","category":"文字抜き出し × 暗号","subtitle":"4枚のカード。♥の数字が表す文字を、①から順に抜き
