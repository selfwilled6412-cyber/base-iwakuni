<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日報Webアプリ体験版 | 株式会社BASE</title><meta name="robots" content="noindex">
<style>:root{font-family:system-ui,"Noto Sans JP",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1026;color:#f5f7ff;line-height:1.6}main{max-width:860px;margin:auto;padding:24px}h1{font-size:clamp(1.8rem,5vw,3rem)}.tag{color:#6cf0d9;font-weight:bold}.panel{background:#182344;border:1px solid #415481;border-radius:18px;padding:22px;margin:20px 0}label{display:grid;gap:6px;margin:12px 0}input,select,textarea,button{font:inherit;padding:12px;border-radius:9px}input,select,textarea{background:#101935;color:#fff;border:1px solid #8b9bc4;width:100%}textarea{min-height:90px}button,.cta{background:#67f3d9;color:#08182a;border:0;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;padding:12px 18px;border-radius:9px;margin:5px 5px 5px 0}.secondary{background:#344675;color:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 180px}.item{border-top:1px solid #425174;padding:12px 0;overflow-wrap:anywhere}small,.muted{color:#c0cee7}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}</style></head>
<body><main><a href="../">← 制作サービスへ戻る</a><p class="tag">BASE WEB APP DEMO</p><h1>日報Webアプリを<br>その場で体験。</h1><p>入力・検索・集計・CSV出力の動作を試せます。これは営業用の<strong>体験版</strong>で、実際の業務データや個人情報を入力しないでください。</p>
<div class="panel"><h2>日報を入力</h2><form id="entry"><div class="row"><label>日付<input name="date" type="date" required></label><label>作業分類<select name="category"><option>事務作業</option><option>制作</option><option>軽作業</option><option>その他</option></select></label></div><label>作業内容<textarea name="note" maxlength="300" required placeholder="例：サンプル資料を作成"></textarea></label><label>作業時間（分）<input name="minutes" type="number" min="1" max="1440" value="60" required></label><button type="submit">サンプル日報を追加</button></form><p id="message" role="status" aria-live="polite"></p></div>
<div class="panel"><h2>記録一覧・集計</h2><p id="summary"></p><label>キーワード検索<input id="search" placeholder="分類・内容を検索"></label><div id="records"></div><button id="csv" class="secondary" type="button">表示中の記録をCSV出力</button><button id="reset" class="secondary" type="button">体験データを初期化</button></div>
<div class="panel"><h2>実際の業務に合わせて制作</h2><p>入力項目、利用人数、共有権限、集計方法、データの保存先などを確認して個別にお見積もりします。体験版は端末内だけで動作し、クラウド保存・複数端末共有・ログイン機能はありません。</p><a class="cta" href="https://lin.ee/z5T92Yn" target="_blank" rel="noopener noreferrer">BASE公式LINEで相談する</a></div></main>
<script>
const key='base-demo-reports-v1';
const samples=[{date:'2026-11-01',category:'事務作業',note:'サンプル：書類の整理',minutes:45},{date:'2026-11-02',category:'制作',note:'サンプル：案内資料の作成',minutes:90}];
let rows=samples.map(x=>({...x}));const form=document.querySelector('#entry'),search=document.querySelector('#search'),list=document.querySelector('#records'),summary=document.querySelector('#summary'),message=document.querySelector('#message');
form.elements.date.value=new Date().toLocaleDateString('sv-SE');
function filtered(){const q=search.value.trim().toLocaleLowerCase();return rows.filter(r=>(r.date+' '+r.category+' '+r.note).toLocaleLowerCase().includes(q));}
function render(){const shown=filtered();summary.textContent='表示 '+shown.length+'件／合計 '+shown.reduce((n,r)=>n+r.minutes,0)+'分（体験用データ）';list.replaceChildren();if(!shown.length){const p=document.createElement('p');p.textContent='該当する記録はありません。';list.append(p)}for(const r of shown){const div=document.createElement('div');div.className='item';const title=document.createElement('strong');title.textContent=r.date+' ｜ '+r.category+' ｜ '+r.minutes+'分';const body=document.createElement('div');body.textContent=r.note;div.append(title,body);list.append(div)}}
form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const d=new FormData(form),note=String(d.get('note')).trim();if(!note){message.textContent='作業内容を入力してください。';return}rows.unshift({date:String(d.get('date')),category:String(d.get('category')),note,minutes:Number(d.get('minutes'))});message.textContent='体験用の記録を追加しました（外部送信なし）。';form.elements.note.value='';render()});search.addEventListener('input',render);
document.querySelector('#reset').addEventListener('click',()=>{rows=samples.map(x=>({...x}));search.value='';message.textContent='体験データを初期化しました。';render()});
document.querySelector('#csv').addEventListener('click',()=>{const escape=v=>'"'+String(v).replaceAll('"','""')+'"';const data=[['日付','分類','内容','作業時間（分）'],...filtered().map(r=>[r.date,r.category,r.note,r.minutes])].map(r=>r.map(escape).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='base-demo-reports.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render();
</script></body></html>
