name: SAIKO Android Emulator UI Smoke
on:
  push:
    branches: [feature/saiko-beat-native-android-20261030]
    paths: [.github/workflows/saiko-android-emulator.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launch-on-android:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare packaged game and compile APK
        run: |
          mkdir -p saiko-android/app/src/main/assets
          cp saiko-rhythm/youtube.html saiko-rhythm/youtube.js saiko-rhythm/youtube-core.js saiko-rhythm/studio-core.js saiko-rhythm/beat-analyzer.js saiko-android/app/src/main/assets/
          cp saiko-rhythm/piano-tiles.html saiko-rhythm/piano-tiles.js saiko-rhythm/piano-core.js saiko-android/app/src/main/assets/
          cd saiko-android
          gradle :app:assembleDebug --no-daemon
      - name: Enable KVM if available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r saiko-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n jp.base.saikobeat/.MainActivity
            sleep 16
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml /tmp/saiko-window.xml || true
            adb shell screencap -p /sdcard/saiko-screen.png
            adb pull /sdcard/saiko-screen.png saiko-android/emulator-screen.png
            python3 - <<'PY'
            import re, xml.etree.ElementTree as ET
            try:
              root=ET.parse('/tmp/saiko-window.xml')
              for n in root.iter('node'):
                label=n.attrib.get('text','')+' '+n.attrib.get('content-desc','')
                if 'すぐにプレイ' in label:
                  box=[int(x) for x in re.findall(r'\d+',n.attrib.get('bounds',''))]
                  if len(box)==4:
                    open('/tmp/saiko-play-tap.txt','w').write(f'{(box[0]+box[2])//2} {(box[1]+box[3])//2}')
                    break
            except Exception as exc: print('UI selector unavailable:',exc)
            PY
            if [ -f /tmp/saiko-play-tap.txt ]; then
              adb shell input tap $(cat /tmp/saiko-play-tap.txt)
              sleep 6
              adb shell screencap -p /sdcard/saiko-playing.png
              adb pull /sdcard/saiko-playing.png saiko-android/emulator-playing.png
              adb shell uiautomator dump /sdcard/playing.xml || true
              adb pull /sdcard/playing.xml saiko-android/emulator-playing.xml || true
            else
              echo "WARN: Accessibility could not locate play button; manual emulator screenshot review required."
            fi
            adb logcat -d -s AndroidRuntime:E SAIKO:E SAIKO-Web:E >saiko-android/emulator-errors.log
            if grep -q 'FATAL EXCEPTION' saiko-android/emulator-errors.log; then
              cat saiko-android/emulator-errors.log
              exit 1
            fi
            grep -q 'SAIKO' saiko-android/emulator-errors.log || true
      - name: Collect screenshot and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saiko-android-emulator-proof
          path: |
            saiko-android/emulator-screen.png
            saiko-android/emulator-playing.png
            saiko-android/emulator-playing.xml
            saiko-android/emulator-errors.log
          if-no-files-found: warn
