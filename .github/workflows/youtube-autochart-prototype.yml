name: SAIKO YouTube Autochart Prototype Tests
on:
  push:
    branches:
      - feature/youtube-autochart-prototype-20261029
    paths:
      - "saiko-rhythm/**"
      - "tests/**"
      - ".github/workflows/youtube-autochart-prototype.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy fastapi uvicorn
      - name: Test synthetic music accents, input validation, and mocked analysis
        run: python -m unittest discover -s saiko-rhythm/autochart-service/tests -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate existing YouTube game and its safe mock
        run: node tests/validate-youtube.cjs && node tests/validate-beat-analyzer.cjs
