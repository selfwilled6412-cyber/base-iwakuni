name: BASE SNS One-Time Cache Bust Drafts

on:
  push:
    branches:
      - buffer-connection-test

permissions:
  contents: write

concurrency:
  group: base-sns-one-time-cache-bust
  cancel-in-progress: false

jobs:
  replace-cached-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buffer-connection-test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r automation/sns/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-match 'Noto Sans CJK JP'

      - name: Delete stale-preview Buffer drafts
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          ids = [
              '6a83046ec354a3f20010a741',
              '6a83046e9011eab36c6d7a63',
              '6a83046f185705c2324442eb',
          ]
          headers = {'Authorization':'Bearer '+os.environ['BUFFER_API_TOKEN'],'Content-Type':'application/json'}
          for post_id in ids:
              q=f'''mutation {{ deletePost(input: {{ id: "{post_id}" }}) {{ ... on DeletePostSuccess {{ id }} ... on VoidMutationError {{ message }} }} }}'''
              r=requests.post('https://api.buffer.com',headers=headers,json={'query':q},timeout=60); r.raise_for_status()
              p=r.json()
              if p.get('errors'): raise RuntimeError(json.dumps(p['errors'],ensure_ascii=False))
              result=p['data']['deletePost']
              if result.get('message'): raise RuntimeError(result['message'])
              print('deleted='+result['id'])
          PY

      - name: Generate content
        run: python automation/sns/generate_content.py

      - name: Render Japanese video
        run: python automation/sns/render_video.py

      - name: Publish unique uncached media URL
        env:
          CONFIRM_PUBLIC_MEDIA: 'YES'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash automation/sns/publish_media.sh
          cat automation/sns/output/public_media_url.txt

      - name: Create replacement Buffer drafts
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CREATE_DRAFTS: 'true'
        run: |
          export BUFFER_MEDIA_URL="$(cat automation/sns/output/public_media_url.txt)"
          export BUFFER_DRAFT_TITLE="$(python -c 'import json; print(json.load(open("automation/sns/output/content.json"))["title"])')"
          export BUFFER_DRAFT_TEXT="$(python -c 'import json; d=json.load(open("automation/sns/output/content.json")); print(d["caption"]+" "+" ".join(d["hashtags"]))')"
          python automation/sns/buffer_draft_video.py

      - name: Verify three replacements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('automation/sns/output/buffer_draft_results.json').read_text(encoding='utf-8'))
          assert len(d)==3, len(d)
          print('replacement_drafts=3')
          PY

      - name: Save diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sns-cache-bust-diagnostics
          path: automation/sns/output/
          retention-days: 7
