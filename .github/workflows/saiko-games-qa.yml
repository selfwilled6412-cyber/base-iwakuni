name: Saiko Games QA
on:
  push:
    branches: [main]
    paths:
      - "saiko-adventure/**"
      - "saiko-kids/**"
      - "saiko-draw/**"
      - "lumi-nazotoki/**"
      - "lumi-escape/**"
      - "lumi-escape-2/**"
      - "saiko-solo-arcade/**"
      - "saiko-party-games/**"
      - "saiko-card-games/**"
      - "saiko-rhythm/**"
      - "saiko-apps/**"
      - "tests/**"
      - ".github/workflows/saiko-games-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate puzzle banks, routes, and all 30 maze stages
        run: node tests/validate-games.cjs && node tests/validate-rhythm.cjs
