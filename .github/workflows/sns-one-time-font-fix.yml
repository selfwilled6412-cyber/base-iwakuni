name: BASE SNS One-Time Font Fix Drafts

on:
  push:
    branches:
      - buffer-connection-test

permissions:
  contents: write

concurrency:
  group: base-sns-one-time-font-fix
  cancel-in-progress: false

jobs:
  replace-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buffer-connection-test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r automation/sns/requirements.txt

      - name: Install Japanese rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-match 'Noto Sans CJK JP'

      - name: Delete previous broken-font Buffer drafts
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          ids = [
              '6a82ed3cc354a3f2000ef9df',
              '6a82ed3cc354a3f2000ef9f9',
              '6a82ed3d9011eab36c6bf105',
          ]
          endpoint = 'https://api.buffer.com'
          headers = {
              'Authorization': 'Bearer ' + os.environ['BUFFER_API_TOKEN'],
              'Content-Type': 'application/json',
          }
          for post_id in ids:
              query = f'''mutation DeleteOldDraft {{
                deletePost(input: {{ id: "{post_id}" }}) {{
                  ... on DeletePostSuccess {{ id }}
                  ... on VoidMutationError {{ message }}
                }}
              }}'''
              r = requests.post(endpoint, headers=headers, json={'query': query}, timeout=60)
              r.raise_for_status()
              payload = r.json()
              if payload.get('errors'):
                  raise RuntimeError(json.dumps(payload['errors'], ensure_ascii=False))
              result = payload['data']['deletePost']
              if result.get('message'):
                  raise RuntimeError(result['message'])
              print('deleted=' + result['id'])
          PY

      - name: Generate replacement content
        run: python automation/sns/generate_content.py

      - name: Render Japanese-font vertical MP4
        run: python automation/sns/render_video.py

      - name: Verify Japanese font path and frame exists
        run: |
          test -s automation/sns/output/frames/slide_1.png
          test -s automation/sns/output/base_sns_preview.mp4

      - name: Publish corrected MP4 to dedicated public media branch
        env:
          CONFIRM_PUBLIC_MEDIA: 'YES'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash automation/sns/publish_media.sh

      - name: Create corrected Buffer drafts only
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CREATE_DRAFTS: 'true'
        run: |
          export BUFFER_MEDIA_URL="$(cat automation/sns/output/public_media_url.txt)"
          export BUFFER_DRAFT_TITLE="$(python -c 'import json; print(json.load(open("automation/sns/output/content.json"))["title"])')"
          export BUFFER_DRAFT_TEXT="$(python -c 'import json; d=json.load(open("automation/sns/output/content.json")); print(d["caption"]+" "+" ".join(d["hashtags"]))')"
          python automation/sns/buffer_draft_video.py

      - name: Verify replacement draft count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('automation/sns/output/buffer_draft_results.json').read_text(encoding='utf-8'))
          assert len(data) == 3, f'expected 3 corrected drafts, got {len(data)}'
          print('corrected_draft_results=3')
          PY

      - name: Save corrected approval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sns-font-fix-approved-drafts
          path: automation/sns/output/
          retention-days: 7
