name: BASE SNS Buffer Connection Test

on:
  push:
    branches:
      - buffer-connection-test
  workflow_dispatch:

jobs:
  buffer-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r automation/sns/requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Buffer connection
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: python automation/sns/buffer_client.py

      - name: Discover Buffer channels
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: python automation/sns/buffer_channels.py

      - name: Validate Buffer draft plan without creating drafts
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CREATE_DRAFTS: 'false'
        run: python automation/sns/buffer_draft_video.py

      - name: Render 30-second vertical preview
        run: python automation/sns/render_video.py

      - name: Save Buffer test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffer-connection-test
          path: automation/sns/output/
          retention-days: 7
