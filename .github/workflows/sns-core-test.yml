name: BASE SNS Core Test

on:
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r automation/sns/requirements.txt

      - name: Generate SNS content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python automation/sns/generate_content.py

      - name: Check Buffer connection
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
        run: python automation/sns/buffer_client.py

      - name: Save test results
        uses: actions/upload-artifact@v4
        with:
          name: sns-core-test
          path: automation/sns/output/
          retention-days: 7
