name: SAIKO BEAT Android APK
on:
  push:
    branches: [feature/saiko-beat-native-android-20261030]
    paths:
      - 'saiko-android/**'
      - 'saiko-rhythm/youtube.html'
      - 'saiko-rhythm/youtube.js'
      - 'saiko-rhythm/youtube-core.js'
      - 'saiko-rhythm/studio-core.js'
      - 'saiko-rhythm/beat-analyzer.js'
      - 'saiko-rhythm/piano*'
      - 'tests/validate-piano.cjs'
      - 'tests/validate-piano-web.cjs'
      - '.github/workflows/saiko-native-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saiko-piano-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy existing rhythm game into Android WebView assets
        run: |
          mkdir -p saiko-android/app/src/main/assets
          cp saiko-rhythm/youtube.html saiko-rhythm/youtube.js saiko-rhythm/youtube-core.js saiko-rhythm/studio-core.js saiko-rhythm/beat-analyzer.js saiko-android/app/src/main/assets/
          cp saiko-rhythm/piano-tiles.html saiko-rhythm/piano-tiles.js saiko-rhythm/piano-core.js saiko-android/app/src/main/assets/
      - name: Verify Piano Tiles note engine and Android bridge
        run: node tests/validate-piano.cjs && node tests/validate-piano-web.cjs
      - name: Compile Android debug APK
        working-directory: saiko-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: saiko-beat-android-debug
          path: saiko-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
