name: BASE SNS Scheduled Preview

on:
  schedule:
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r automation/sns/requirements.txt

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-match 'Noto Sans CJK JP'

      - name: Generate SNS content
        run: python automation/sns/generate_content.py

      - name: Add sales conversion CTA
        run: python automation/sns/enrich_sales_cta.py

      - name: Render 30-second vertical preview
        run: python automation/sns/render_video.py

      - name: Validate Buffer targets without creating drafts
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CREATE_DRAFTS: 'false'
        run: python automation/sns/buffer_draft_video.py

      - name: Save approval-ready package
        uses: actions/upload-artifact@v4
        with:
          name: base-sns-approval-package-${{ github.run_number }}
          path: automation/sns/output/
          retention-days: 14
