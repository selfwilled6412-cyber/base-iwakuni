name: BASE Cinematic Pilot - Licensed Video and 3 SNS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - marketing/scs/stock_ad_pilot.py
      - marketing/scs/cinematic_cut.py
      - .github/workflows/base-cinematic-pilot.yml
  pull_request:
    paths:
      - marketing/scs/stock_ad_pilot.py
      - marketing/scs/cinematic_cut.py
      - .github/workflows/base-cinematic-pilot.yml
  schedule:
    - cron: '35 */6 * * *' # Check incomplete pilot; no duplicates after sent
concurrency:
  group: base-cinematic-pilot
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - name: Render real 3-shot cinematic preview (no social publishing)
        run: python marketing/scs/stock_ad_pilot.py --preview
      - name: Upload film, sampled review frames, and rights attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-cinematic-licensed-preview
          path: marketing/scs/output/cinematic-pilot/
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - name: Verify exact BASE channels and safely publish pilot by durable marker
        run: python marketing/scs/stock_ad_pilot.py
      - name: Keep review frames and publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-cinematic-pilot-${{ github.run_id }}
          path: marketing/scs/output/cinematic-pilot/
          retention-days: 7
