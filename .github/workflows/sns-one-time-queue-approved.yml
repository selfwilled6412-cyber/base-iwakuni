name: BASE SNS One-Time Queue Approved Drafts

on:
  push:
    branches:
      - buffer-connection-test

permissions:
  contents: read

jobs:
  queue-approved:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buffer-connection-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r automation/sns/requirements.txt
      - name: Queue explicitly approved three drafts
        env:
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_APPROVED_DRAFT_IDS: '6a83854633ec6735e90d6a39,6a838546521d595791536a2b,6a838547a6afcff0dbbde887'
          CONFIRM_BUFFER_QUEUE: 'APPROVE_FOR_QUEUE'
        run: python automation/sns/buffer_approve_queue.py
      - name: Verify queue results exist
        run: test -s automation/sns/output/buffer_approval_results.json
