<img class="introLumi" src="../assets/lumi-approved.webp" alt="案内役のルミ"><h1>ルミとみんなでゲーム大会！</h1><p>大画面を見て答えてね。スタッフがゲームを進行する方式です。</p></div><div class="cards"><article class="card"><div class="emoji">🎱</div><h2>数字ビンゴ大会</h2><p>75個の数字を重複なしで抽選。カードの印刷もできる！</p><button data-game="bingo" class="primary">ゲームを始める ▶</button></article><article class="card"><div class="emoji">🎭</div><h2>ジェスチャー対決</h2><p>80種類のお題を身ぶりで表現するチームゲーム。</p><button data-game="gesture" class="primary">ゲームを始める ▶</button></article><article class="card"><div class="emoji">💭</div><h2>ヒントで連想大会</h2><p>3段階のヒントを出して答えを推理する50問。</p><button data-game="association" class="primary">ゲームを始める ▶</button></article><article class="card"><div class="emoji">⭕❌</div><h2>○×クイズ大会</h2><p>正解が明確な50問に、みんなで○か×で答えよう！</p><button data-game="ox" class="primary">ゲームを始める ▶</button></article></div></section><section id="game" class="game" hidden><div class="gameHead"><h2 id="title"></h2><div><button id="full">⛶ 全画面</button><button id="restart">↻ リセット</button><button id="back">⌂ 戻る</button></div></div><div class="status" id="status"></div><div class="board" id="board"></div><div class="scores" id="scores"></div><div class="controls" id="actions"></div><div id="printCards" class="print"></div></section></main><script defer src="app.js"></script></body></html>
