<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイ校 みんなでゲーム大会｜4つの大画面ゲーム</title><style>*{box-sizing:border-box}body{margin:0;background:#eff7ff;font-family:system-ui,-apple-system,sans-serif;color:#12395e}header{background:#105aa3;color:white;border-bottom:7px solid #ffca48;padding:18px}header>div,main{max-width:1150px;margin:auto}header strong{font-size:clamp(24px,3vw,38px)}header a{color:white;float:right;font-weight:900}main{padding:19px 15px 55px}.intro,.game{background:white;border:3px solid #c6e0f7;border-radius:22px;padding:23px;margin-bottom:19px}.intro h1{font-size:clamp(25px,3vw,36px);margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.card{padding:19px;border:3px solid #b5d5f0;border-radius:22px;background:white}.card h2{font-size:clamp(23px,2.5vw,30px)}.card p,.intro p{line-height:1.65}.emoji{font-size:68px}button{cursor:pointer;border:2px solid #9cbfdf;background:#eaf5ff;color:#15508a;border-radius:14px;min-height:52px;padding:9px 17px;font-size:clamp(17px,1.8vw,24px);font-weight:900;margin:5px}button.primary{background:#ffce52;border-color:#d99d23;color:#634100}button:disabled{opacity:.5}button:focus-visible,a:focus-visible{outline:4px solid #ffab1c;outline-offset:3px}.game[hidden],.home[hidden],[hidden]{display:none!important}.gameHead,.controls{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.gameHead h2{font-size:clamp(26px,3vw,42px)}.status{font-size:clamp(17px,2vw,25px);font-weight:900;background:#eef7ff;border-radius:15px;padding:15px;margin:12px 0}.board{display:grid;place-items:center;text-align:center;min-height:230px;gap:17px}.big{font-size:clamp(55px,10vw,130px);font-weight:1000;color:#155fac}.prompt{font-size:clamp(31px,5vw,70px);font-weight:1000;line-height:1.4}.hint{font-size:clamp(22px,3vw,40px);font-weight:900;background:#fff1c0;border:3px solid #ecc95a;border-radius:15px;padding:17px}.answer{font-size:clamp(37px,5vw,75px);font-weight:1000;background:#d8ffe3;border:3px solid #83ca99;border-radius:15px;padding:19px}.history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.history span{font-size:20px;font-weight:900;background:#e9f5ff;padding:8px 14px;border-radius:10px}.scores{display:flex;gap:13px;justify-content:center;font-size:24px;font-weight:900}.scores button{font-size:20px}.print{display:none}.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;border:3px solid #245a9a}.bingo div{min-height:38px;display:grid;place-items:center;font-weight:900;border:1px solid #c1d4eb}.bingo .head{background:#1664a3;color:white}@media(max-width:650px){.cards{grid-template-columns:1fr}.game,.intro{padding:12px}.prompt{font-size:30px}}@media print{@page{size:A4 portrait;margin:7mm}header,.home,.gameHead,.status,.board,.controls,.scores{display:none!important}main,.game{margin:0;padding:0;border:0}.print{display:grid!important;grid-template-columns:repeat(2,1fr);gap:7mm}.cardPrint{border:3px solid #245a9a;padding:9px;break-inside:avoid}.cardPrint h3{text-align:center}.bingo div{height:17mm;font-size:23px}}.partyBrand{display:flex;align-items:center;gap:15px}.partyBrand strong{flex:1}.partyBrand a{float:none}.brandLogo{background:#fff;padding:7px;width:125px;max-height:75px;object-fit:contain;border-radius:12px}.introLumi{width:89px;height:89px;border-radius:15px;object-fit:cover;float:right;margin:0 0 9px 15px}@media(max-width:600px){.brandLogo{width:84px}.partyBrand strong{font-size:21px}.partyBrand a{font-size:12px;padding:7px}}
/* SAIKO STAGE: premium big-screen visual design */
body{background:radial-gradient(circle at 100% 2%,#cfc2fd 0,transparent 35%),radial-gradient(circle at 0 80%,#bef6f5 0,transparent 37%),#f0f5ff}
header{background:linear-gradient(110deg,#17104c,#4934a6 55%,#127f9b);border-bottom:10px solid #ffd15e;box-shadow:0 10px 25px #261a602a}

.card:nth-child(2n):after{color:#aae7f255}.card:hover{transform:translateY(-8px);box-shadow:0 19px 33px #35278b37,0 6px #bfb0ed}
.emoji{filter:drop-shadow(0 11px 11px #49347840);position:relative;z-index:1}
.card h2{position:relative;z-index:1}

.game{background:linear-gradient(140deg,#20184c,#163d68 72%,#1a5c65);border:3px solid #9e8ee7;color:#fff;box-shadow:0 18px 43px #16102f73;border-radius:28px}

.game[data-mode="bingo"] .board>.big{width:clamp(200px,28vw,340px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 22%,#fff5b2,#ffce54 42%,#ea8156 90%);color:#65306c;border:11px solid #fff7d7;box-shadow:0 10px 32px #0008,inset 0 8px 23px #fff7}
.game .history span{background:#ffffffef;color:#1c4781;border:2px solid #b4e5ff;border-radius:11px;box-shadow:0 3px #2e5b81;font-weight:950}

.game .answer{color:#0b5436;background:linear-gradient(135deg,#e6ffbd,#a6fad4);border:4px solid #a4ffc7;box-shadow:0 9px 25px #56f4b052}
.game .scores{color:#fff}
.game .scores>div{background:#ffffff1e;border:2px solid #ffffff62;border-radius:20px;padding:11px 18px}
.game .controls button{background:linear-gradient(110deg,#fff3b2,#f9cb77);border:3px solid #ffdb87;box-shadow:0 5px #8a5a54;color:#604373;min-height:64px}
.game .controls button:active{transform:translateY(3px);box-shadow:0 2px #8a5a54}
.gameHead button{background:#ffffff17;color:#fff;border-color:#ffffff80}
@media(max-width:650px){.game .board{min-height:245px}.game[data-mode="bingo"] .board>.big{width:175px;border-width:6px}.game .controls button{min-height:50px}.card:hover{transform:none}}
@media(prefers-reduced-motion:reduce){.card,button.primary{transition:none!important}}
@media print{body{background:white!important;color:#111!important}.game{background:white!important;color:#111!important;border:none!important;box-shadow:none!important}.game .board{display:none!important}.game .controls{display:none!important}}
