function patchLayer(p){if(!p.patches)return '';const id='patch-'+p.id;return '<svg class="patches" viewBox="0 0 1024 1536" preserveAspectRatio="none" aria-hidden="true"><defs><clipPath id="'+id+'">'+p.patches.map(points=>'<polygon points="'+points.map(v=>v.join(',')).join(' ')+'"/>').join('')+'</clipPath></defs><image href="'+p.b+'" width="1024" height="1536" clip-path="url(#'+id+')"/></svg>'};
function inPatch(points,x,y){let inside=false;for(let i=0,j=points.length-1;i<points.length;j=i++){const [xi,yi]=points[i],[xj,yj]=points[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside}return inside};
function marks(){const p=puzzles[index];for(const side of ['a','b']){$('marks-'+side).innerHTML=(side==='b'?patchLayer(p):'')+[...found].map(i=>{const h=p.answers[i];return '<span class="pin" style="left:'+(h.x*100)+'%;top:'+(h.y*100)+'%"></span>'}).join('')+(lastHint===null?'':(()=>{const h=p.answers[lastHint];return '<span class="pin hint" style="left:'+(h.x*100)+'%;top:'+(h.y*100)+'%"></span>'})())}};function open(i){if(timer)clearInterval(timer);if(i<0||i>=puzzles.length)return;index=i;found=new Set();wrong=0;seconds=0;paused=false;lastHint=null;complete=false;const p=puzzles[i];$('gallery').hidden=true;$('game').hidden=false;$('title').textContent=p.difficulty+'｜'+p.name;$('img-a').src=p.a;$('img-b').src=p.patches?p.a:p.b;$('finish').hidden=true;$('status').textContent=p.answers.length+'か所の違いを見つけよう！ 左右どちらでもタップOK';$('hint').disabled=false;stat();marks();timer=setInterval(()=>{if(!paused&&!complete){seconds++;stat()}},1000);$('game').scrollIntoView({block:'start'})};function next(){const level=index<0?selectedLevel:puzzles[index].difficulty;const choices=puzzles.map((p,i)=>p.difficulty===level?i:-1).filter(i=>i>=0);open(choices[(choices.indexOf(index)+1)%choices.length])};function tap(e){if(index<0||complete)return;const rect=e.currentTarget.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;const p=puzzles[index];let best=-1,dist=1e4;for(let i=0;i<p.answers.length;i++){const a=p.answers[i];const d=p.patches&&inPatch(p.patches[i],x*1024,y*1536)?0:((x-a.x)/a.rx)**2+((y-a.y)/a.ry)**2;if(d<dist){dist=d;best=i}}if(dist>1||best<0){wrong++;$('status').textContent='👀 そこは同じみたい。もう少し探してみよう！';return}if(found.has(best)){$('status').textContent='✅ そこはもう見つけているよ！';return}found.add(best);lastHint=null;stat();marks();$('status').textContent='🎉 正解！ '+found.size+' / '+p.answers.length+'か所発見！';if(found.size===p.answers.length){complete=true;clearInterval(timer);$('hint').disabled=true;records[p.id]={seconds,wrong};store();$('finish').hidden=false;$('finishtext').textContent=p.answers.length+'か所すべて発見！ '+stamp(seconds)+'、ミスタップ'+wrong+'回。おめでとう！';$('status').textContent='🏆 クリア！';$('finish').scrollIntoView({behavior:'smooth',block:'nearest'})}};function hint(){const p=puzzles[index],available=p.answers.map((_,i)=>i).filter(i=>!found.has(i));if(!available.length)return;lastHint=available[Math.floor(Math.random()*available.length)];marks();$('status').textContent='💡 金色の丸がヒント！';};function back(){clearInterval(timer);index=-1;$('game').hidden=true;$('gallery').hidden=false;renderCards();window.scrollTo({top:0,behavior:'auto'})};for(const panel of document.querySelectorAll('.painting'))panel.addEventListener('click',tap);$('back').onclick=back;$('switch').onclick=next;$('finishnext').onclick=next;$('hint').onclick=hint;$('zoom').onclick=()=>{zoom=!zoom;$('artpair').classList.toggle('zoomed',zoom);$('zoom').textContent=zoom?'↩ 拡大を戻す':'🔎 拡大';$('zoom').setAttribute('aria-pressed',String(zoom))};$('layout').onclick=()=>{wide=!wide;$('artpair').style.gridTemplateColumns=wide?'repeat(2,minmax(0,1fr))':'';$('layout').textContent=wide?'⇅ 自動配置':'⇄ 横並び';$('layout').setAttribute('aria-pressed',String(wide))};document.addEventListener('visibilitychange',()=>{paused=document.hidden});function chooseLevel(level){selectedLevel=level;for(const [id,name] of [['easy','初級'],['normal','中級'],['hard','上級']])$('level-'+id).setAttribute('aria-pressed',String(name===level));$('level-status').textContent=level+'・'+puzzles.filter(p=>p.difficulty===level).length+'問';renderCards()};$('level-easy').onclick=()=>chooseLevel('初級');$('level-normal').onclick=()=>chooseLevel('中級');$('level-hard').onclick=()=>chooseLevel('上級');chooseLevel('初級');window.SaikoPremiumGame=Object.freeze({open,tapAt:(side,x,y)=>{const el=document.querySelector('.painting[data-side="'+side+'"]');const r=el.getBoundingClientRect();tap({currentTarget:el,clientX:r.left+x*r.width,clientY:r.top+y*r.height})},getState:()=>({index,found:[...found],wrong,seconds,complete})})})();
</script></body></html>
