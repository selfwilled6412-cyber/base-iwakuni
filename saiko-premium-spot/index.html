<script>
(()=>{'use strict';const puzzles=JSON.parse(document.getElementById('puzzledata').textContent),$=id=>document.getElementById(id);let index=-1,found=new Set(),lastHint=null,wrong=0,seconds=0,timer=null,paused=false,zoom=false,wide=false,complete=false;const STORAGE='saiko-premium-spot-preview-v1';let records={};try{records=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){};const store=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(records))}catch(e){}};function stamp(time){return Math.floor(time/60)+':'+String(time%60).padStart(2,'0')};let selectedLevel='初級';function renderCards(){$('cards').innerHTML=puzzles.map((p,i)=>p.difficulty!==selectedLevel?'':'<button class="card" type="button" data-index="'+i+'"><img src="'+p.a+'" alt="'+p.name+'の風景"><div class="cardBody"><small>'+p.difficulty+' · '+p.answers.length+'か所のちがい</small><h3>'+p.emoji+' '+p.name+'</h3><p>'+p.tag+'</p><div class="startBadge"><span>'+(records[p.id]?'🏆 クリア済み':'✨ はじめて挑戦')+'</span><span>あそぶ →</span></div></div></button>').join('');$('cards').querySelectorAll('[data-index]').forEach(el=>el.addEventListener('click',()=>open(Number(el.dataset.index))))};function stat(){const p=puzzles[index];$('found').textContent=found.size+' / '+p.answers.length;$('remaining').textContent=p.answers.length-found.size;$('time').textContent=stamp(seconds);$('progress').style.width=(100*found.size/p.answers.length)+'%'};// Only the authored object regions use the edited bitmap. Everything else uses A.
function patchLayer(p){if(!p.patches)return '';const id='patch-'+p.id;return '<svg class="patches" viewBox="0 0 1024 1536" preserveAspectRatio="none" aria-hidden="true"><defs><clipPath id="'+id+'">'+p.patches.map(points=>'<polygon points="'+points.map(v=>v.join(',')).join(' ')+'"/>').join('')+'</clipPath></defs><image href="'+p.b+'" width="1024" height="1536" clip-path="url(#'+id+')"/></svg>'};
function inPatch(points,x,y){let inside=false;for(let i=0,j=points.length-1;i<points.length;j=i++){const [xi,yi]=points[i],[xj,yj]=points[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside}return inside};
function marks(){const p=puzzles[index];for(const side of ['a','b']){$('marks-'+side).innerHTML=(side==='b'?patchLayer(p):'')+[...found].map(i=>{const h=p.answers[i];return '<span class="pin" style="left:'+(h.x*100)+'%;top:'+(h.y*100)+'%"></span>'}).join('')+(lastHint===null?'':(()=>{const h=p.answers[lastHint];return '<span class="pin hint" style="left:'+(h.x*100)+'%;top:'+(h.y*100)+'%"></span>'})())}};function open(i){if(timer)clearInterval(timer);if(i<0||i>=puzzles.length)return;index=i;found=new Set();wrong=0;seconds=0;paused=false;lastHint=null;complete=false;const p=puzzles[i];$('gallery').hidden=true;$('game').hidden=false;$('title').textContent=p.difficulty+'｜'+p.name;$('img-a').src=p.a;$('img-b').src=p.patches?p.a:p.b;$('finish').hidden=true;$('status').textContent=p.answers.length+'か所の違いを見つけよう！ 左右どちらでもタップOK';$('hint').disabled=false;stat();marks();timer=setInterval(()=>{if(!paused&&!complete){seconds++;stat()}},1000);$('game').scrollIntoView({block:'start'})};function next(){const level=index<0?selectedLevel:puzzles[index].difficulty;const choices=puzzles.map((p,i)=>p.difficulty===level?i:-1).filter(i=>i>=0);open(choices[(choices.indexOf(index)+1)%choices.length])};function tap(e){if(index<0||complete)return;const rect=e.currentTarget.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;const p=puzzles[index];let best=-1,dist=1e4;for(let i=0;i<p.answers.length;i++){const a=p.answers[i];const d=p.patches&&inPatch(p.patches[i],x*1024,y*1536)?0:((x-a.x)/a.rx)**2+((y-a.y)/a.ry)**2;if(d<dist){dist=d;best=i}}if(dist>1||best<0){wrong++;$('status').textContent='👀 そこは同じみたい。もう少し探してみよう！';return}if(found.has(best)){$('status').textContent='✅ そこはもう見つけているよ！';return}found.add(best);lastHint=null;stat();marks();$('status').textContent='🎉 正解！ '+found.size+' / '+p.answers.length+'か所発見！';if(found.size===p.answers.length){complete=true;clearInterval(timer);$('hint').disabled=true;records[p.id]={seconds,wrong};store();$('finish').hidden
