<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c5eac"><title>ルミの脱出ミッション｜サイ校プロジェクト岩国</title><meta name="description" content="サイ校プロジェクト岩国の大型モニター対応・全5部屋のストーリー型謎解きゲーム"><style>*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#172c53;background:radial-gradient(circle at top,#9adeff 0,#d9f1ff 35%,#f2f8ff 70%);min-height:100vh}.top{background:linear-gradient(105deg,#083d89,#0973c4);border-bottom:8px solid #ffcb3c;color:#fff;padding:15px clamp(12px,3vw,46px);display:flex;align-items:center;justify-content:space-between;gap:14px}.identity{display:flex;align-items:center;gap:13px}.identity img{width:130px;max-height:70px;object-fit:contain;background:white;padding:6px;border-radius:14px}.identity h1{font-size:clamp(23px,2.7vw,40px);line-height:1.2;margin:0}.sub{font-size:clamp(13px,1.4vw,21px);font-weight:750;margin:4px 0 0}.top a{color:#fff;font-weight:850;padding:9px 13px;border:2px solid #a8dfff;border-radius:13px;text-decoration:none}.content{width:min(1520px,100%);margin:auto;padding:clamp(12px,2vw,25px)}.screen{background:#fff;border:6px solid #b1dfff;border-radius:29px;box-shadow:0 14px 40px #073d7824;padding:clamp(16px,3vw,38px)}.hero{display:flex;align-items:center;gap:20px}.hero img{width:clamp(90px,11vw,160px);height:clamp(90px,11vw,160px);object-fit:cover;border:5px solid #d4e9ff;border-radius:24px}.heroTitle{font-size:clamp(27px,4.2vw,54px);font-weight:1000;line-height:1.26;margin:0 0 9px}.lead{font-size:clamp(17px,2.1vw,27px);line-height:1.65;font-weight:730}.startRibbon{color:#895208;font-size:clamp(15px,1.7vw,21px);font-weight:900;background:#ffefbb;border:3px solid #ffcb4b;border-radius:13px;padding:10px;margin-bottom:17px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:23px}.btn{border:3px solid transparent;border-radius:18px;padding:14px 21px;min-height:55px;cursor:pointer;font-weight:950;font-size:clamp(17px,1.8vw,25px);background:#edf4ff;color:#114a89}.btn.primary{background:#f83b43;color:white;box-shadow:0 6px #ad2735}.btn.gold{background:#ffce40;color:#654006;box-shadow:0 6px #bb8c18}.btn.navy{background:#1458a0;color:#fff}.btn:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:4px solid #ff9b00;outline-offset:4px}.track{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0 26px}.track span{padding:10px 13px;border:2px solid #c2dfff;background:#fff;border-radius:14px;font-weight:950;font-size:clamp(14px,1.4vw,20px)}.track .done{background:#d3ffdb;color:#116338;border-color:#79ce8d}.track .current{background:#ffdd70;border-color:#e4a928;color:#674100}.puzzle{border-radius:26px;border:5px solid #e8bc77;background:#fffcf3;padding:clamp(17px,2.4vw,31px);box-shadow:inset 0 0 0 5px #fff8e9}.pill{border-radius:50px;background:#e8f2ff;border:2px solid #aed4ff;display:inline-block;font-size:clamp(14px,1.3vw,20px);padding:7px 15px;font-weight:900;color:#1b5d9b}.puzzle h2{font-size:clamp(27px,3.2vw,48px);margin:15px 0 11px}.intro{font-weight:760;font-size:clamp(19px,2vw,29px);line-height:1.72;margin:6px 0 23px}.question{font-size:clamp(23px,2.4vw,36px);font-weight:1000;text-align:center;background:#fff0ba;border:3px dashed #e9c157;border-radius:16px;padding:13px;margin:20px 0 0}.chests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.chest{padding:15px 12px;background:#fff;border:3px solid #d5c5ad;border-radius:19px;min-height:145px;display:flex;align-items:center;flex-direction:column;gap:7px;text-align:center;font-weight:850;font-size:clamp(16px,1.6vw,24px)}.chestEmoji{font-size:clamp(36px,4vw,62px)}.chest span:last-child{line-height:1.45}.codeClues{display:grid;gap:10px}.codeRow{border:3px solid #d6e4fa;border-radius:15px;background:#fff;display:flex;align-items:center;gap:20px;padding:9px 13px}.codeRow strong{display:flex;gap:5px;flex-shrink:0}.codeRow strong span{display:grid;place-items:center;background:#173b72;color:#fff;border-radius:10px;font-size:clamp(24px,3vw,40px);width:clamp(39px,4.5vw,63px);height:clamp(43px,4.5vw,63px)}.codeRow p{font-size:clamp(16px,1.7vw,25px);font-weight:790;margin:0}.lineSlots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:760px;margin:15px auto}.lineSlots span{border:4px solid #abc8e9;background:#fff;border-radius:14px;display:grid;place-items:center;height:85px;font-size:32px;font-weight:1000}.lineSlots span.center{background:#ffe09d;border-color:#efa631}.clueList,.finalRules{display:grid;gap:10px;font-size:clamp(18px,2vw,30px);font-weight:800;line-height:1.4}.clueList>div,.finalRules>div{background:#fff;border:2px solid #dfd1b8;padding:12px;border-radius:13px}.names,.caseNote{background:#e4f4ff;padding:13px 17px;border-radius:13px;font-size:clamp(16px,1.7vw,25px);font-weight:800}.switches{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.switches>div{border:3px solid var(--c);border-radius:18px;background:#fff;display:flex;align-items:center;flex-direction:column;font-size:38px;gap:3px;padding:15px}.switches strong{font-size:clamp(32px,3.5vw,55px)}.switches b{font-size:clamp(17px,2vw,26px)}.finalRules span{color:#006ecf;font-weight:1000}.codeSlots{display:flex;gap:16px;justify-content:center;margin:20px}.codeSlots span{background:#1c3d71;color:#ffde54;border-radius:12px;display:grid;place-items:center;width:clamp(55px,7vw,93px);height:clamp(65px,7vw,107px);font-size:clamp(39px,5vw,64px)}.hint{display:none;margin:20px 0 0;padding:18px;background:#fff0a7;border:4px solid #f4c544;border-radius:19px;font-size:clamp(18px,2.1vw,29px);line-height:1.6;font-weight:850}.hint.visible{display:block}.hint>strong{display:block;color:#a35100}.reveal{display:none;margin:18px 0 0;padding:22px;background:#e4ffe8;border:4px solid #58bb7d;border-radius:19px}.reveal.visible{display:block}.reveal h3{font-size:clamp(28px,3vw,43px);margin:0 0 7px;color:#075b31}.reveal p{font-size:clamp(17px,1.7vw,25px);line-height:1.65;margin:0}.status{font-size:17px;color:#44576b}.bannerEnd{background:#dffce5;border-radius:21px;border:4px solid #7cc987;padding:20px;font-weight:900;font-size:clamp(22px,3vw,34px)}@media(max-width:720px){.top{align-items:flex-start}.identity img{width:85px}.top a{font-size:13px}.chests{grid-template-columns:repeat(2,1fr)}.switches{grid-template-columns:repeat(2,1fr)}.codeRow{align-items:flex-start;flex-direction:column;gap:8px}.hero{align-items:flex-start}.hero img{width:90px;height:90px}.lineSlots{gap:4px}.lineSlots span{height:56px}.actions .btn{width:100%}.content{padding:8px}.screen{border-width:3px}.puzzle{border-width:3px}}</style></head><body><header class="top"><div class="identity"><img src="https://storage.googleapis.com/studio-design-asset-files/projects/V5a73rv7aR/s-1901x504_v-frms_webp_cf16287b-a688-4d6f-afad-af48e43834df_small.webp" alt="サイ校プロジェクトのロゴ" onerror="this.hidden=true"><div><h1>🕵️ ルミの脱出ミッション</h1><p class="sub">サイ校プロジェクト岩国｜新作・特別編</p></div></div><a href="../saiko-apps/">⌂ アプリ一覧へ</a></header><main class="content"><section id="welcome" class="screen"><div class="startRibbon">🔐 謎解き特別編・全5つの部屋</div><div class="hero"><img src="../assets/lumi-approved.webp" alt="案内役のルミ"><div><h2 class="heroTitle">閉ざされた5つの部屋から脱出せよ！</h2><p class="lead">ルミからの挑戦状！ 4つの部屋で手がかりを集め、最後の暗証番号を解読しよう。</p></div></div><p class="lead">利用者さんは画面を見て、ひとりずつスタッフに答えを伝えよう。ヒントと答えの発表はスタッフが操作。各部屋に3段階ヒント付き。</p><div class="actions"><button class="btn primary" id="start">🚀 最初の部屋から始める</button><button class="btn navy" id="resume" hidden>▶ 前回の続きから</button><a class="btn" style="text-decoration:none" href="staff.html" target="_blank" rel="noopener">📋 スタッフ専用カンペ</a></div><p class="status">※続きからの再開は、このブラウザ内に保存されます。人を交代するときはリセットできます。</p></section><section id="game" class="screen" hidden><div class="track" id="track"></div><article class="puzzle" id="puzzle"></article><div id="hint" class="hint" role="status" aria-live="polite"></div><div id="reveal" class="reveal" role="status" aria-live="polite"></div><div class="actions"><button id="speak" class="btn navy">🔊 ルミの読み上げ</button><button id="hintBtn" class="btn gold">💡 ヒント①を表示</button><button id="revealBtn" class="btn">✅ 正解を発表</button><button id="next" class="btn primary" disabled>➡ 次の部屋へ</button><button id="reset" class="btn">↺ 最初から</button><a class="btn" href="staff.html" target="_blank" rel="noopener" style="text-decoration:none">📋 カンペ</a></div></section></main><script>const CASES=[{"icon":"🗝️","name":"第1の部屋｜4つの宝箱","type":"証言・真偽推理","intro":"この部屋の鍵は、A・B・C・Dのどれか1つに隠されている。貼り紙のうち、正しいものはちょうど2枚。鍵はどこ？","body":"<div class=\"chests\"><div class=\"chest\"><span class=\"chestEmoji\">📦</span><b>宝箱 A</b><span>鍵は B か C にある</span></div><div class=\"chest\"><span class=\"chestEmoji\">📦</span><b>宝箱 B</b><span>鍵は A にはない</span></div><div class=\"chest\"><span class=\"chestEmoji\">📦</span><b>宝箱 C</b><span>鍵は D にはない</span></div><div class=\"chest\"><span class=\"chestEmoji\">📦</span><b>宝箱 D</b><span>鍵は A にある</span></div></div>","q":"鍵のある宝箱を答えてね。","answer":"A","hints":["まず、鍵がAにあると仮定して、4枚の貼り紙の真偽を数えよう。","Aの場合はCとDだけが正しい。","BやCの場合は正しい貼り紙が3枚、Dの場合は1枚になる。"],"explain":"鍵がA：A×・B×・C○・D○で正しい札は2枚。B・Cでは3枚、Dでは1枚。条件を満たすのはAのみ。"},{"icon":"🔐","name":"第2の部屋｜金庫の暗証番号","type":"条件付き数字推理","intro":"3桁の暗証番号を解読しよう。同じ数字は使われず、先頭が0になる可能性もある。各行の「位置も正しい」と「数字だけ正しい」は、必ずちょうど指定の個数。","body":"<div class=\"codeClues\"><div class=\"codeRow\"><strong><span>8</span><span>1</span><span>4</span></strong><p>正しい数字は1個。位置は違う。</p></div><div class=\"codeRow\"><strong><span>4</span><span>1</span><span>3</span></strong><p>正しい数字は1個。位置も正しい。</p></div><div class=\"codeRow\"><strong><span>0</span><span>8</span><span>6</span></strong><p>正しい数字は2個。うち1個は位置も正しい。</p></div><div class=\"codeRow\"><strong><span>9</span><span>3</span><span>8</span></strong><p>正しい数字は0個。</p></div></div>","q":"金庫の3桁の番号は？","answer":"406","hints":["938にある9・3・8は使わない。","413の一致位置は4が先頭か、1が真ん中。814には位置の一致がないことも考えて。","4が先頭、0が中央、6が最後。全部のヒントを逆から確認しよう。"],"explain":"406なら814は4だけ位置違い、413は4だけ位置一致、086は0（位置違い）と6（位置一致）、938は全滅。異なる数字の全候補を照合しても406だけ。"},{"icon":"👥","name":"第3の部屋｜証人の並び順","type":"席順ロジック","intro":"5人が左から一列に並んで写真を撮った。次の条件だけで並び順が決まる。ちょうど中央の3番目にいたのは誰？","body":"<div class=\"lineSlots\"><span>1</span><span>2</span><span class=\"center\">3</span><span>4</span><span>5</span></div><div class=\"clueList\"><div>① イオは一番左。</div><div>② ウタはエマのすぐ左。</div><div>③ オトはアオのすぐ右。</div><div>④ エマは中央ではない。</div><div>⑤ アオは右端ではない。</div></div><p class=\"names\">5人：アオ・イオ・ウタ・エマ・オト</p>","q":"3番目の人を答えてね。","answer":"オト","hints":["イオを左端に固定して、2人組「アオ→オト」と「ウタ→エマ」を置こう。","エマは3番目ではないので、2人組を置ける位置がかなり絞られる。","左から イオ・アオ・オト・ウタ・エマ になる。"],"explain":"全120通りから①～⑤をすべて満たすのはイオ・アオ・オト・ウタ・エマだけ。中央はオト。"},{"icon":"💡","name":"第4の部屋｜電気の仕掛け","type":"組合せ推理","intro":"4色のスイッチのうち、必ず2つだけをONにする。点灯したときに表示される数字の合計は7。さらに赤はOFFだった。どの2色をONにした？","body":"<div class=\"switches\"><div style=\"--c:#f65b5b\">🔴<b>赤</b><strong>2</strong></div><div style=\"--c:#4f91e7\">🔵<b>青</b><strong>4</strong></div><div style=\"--c:#5cb971\">🟢<b>緑</b><strong>3</strong></div><div style=\"--c:#f7cf4d\">🟡<b>黄</b><strong>5</strong></div></div><div class=\"caseNote\">条件：2つだけON ／ 合計7 ／ 赤はOFF</div>","q":"ONにした2色は？","answer":"青と緑","hints":["7になる2つの数字の組を探そう。","2＋5と、4＋3の2通りが候補。","2は赤スイッチ。赤はOFFだから、残る組を選ぼう。"],"explain":"7を作れる組合せは赤2＋黄5と青4＋緑3の2通り。赤がOFFなので青と緑。"},{"icon":"🚪","name":"最後の部屋｜脱出コード","type":"4つの手がかりを合体","intro":"最後の扉には4桁の暗証番号が必要。これまで解いた4つの部屋の答えを、次の規則に変換して左から並べよう。","body":"<div class=\"finalRules\"><div><span>①</span>宝箱の記号：A=1、B=2、C=3、D=4</div><div><span>②</span>金庫の暗証番号の「百の位」</div><div><span>③</span>中央の人の名前のひらがな文字数</div><div><span>④</span>ONにしたスイッチの数</div></div><div class=\"codeSlots\"><span>?</span><span>?</span><span>?</span><span>?</span></div>","q":"最後の4桁の番号は？","answer":"1422","hints":["前の4部屋の答えを思い出そう。スタッフの手元には記録があるよ。","宝箱はA、金庫は406、中央はオト、スイッチは青と緑。","A→1、406の百の位→4、オト→2文字、ONの数→2個。"],"explain":"第1の部屋のA=1、第2の金庫406の百の位=4、第3のオト=2文字、第4の青と緑=2個。ゆえに1422。"}];const K='saiko-escape-mission-v1';const byId=id=>document.getElementById(id);let step=0,hint=0,shown=false;let saved=null;try{saved=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(saved?.step>=0&&saved.step<CASES.length)byId('resume').hidden=false;const store=()=>{try{localStorage.setItem(K,JSON.stringify({step,hint,shown}))}catch(e){}};function speak(){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let c=CASES[step];const u=new SpeechSynthesisUtterance(c.name+'。'+c.intro+'。'+c.q);u.lang='ja-JP';u.rate=.87;window.speechSynthesis.speak(u)}function paint(){const c=CASES[step];byId('welcome').hidden=true;byId('game').hidden=false;byId('track').innerHTML=CASES.map((x,i)=>'<span class="'+(i<step?'done':i===step?'current':'')+'">'+(i<step?'✓ ':i===step?'➤ ':'')+'第'+(i+1)+'の部屋</span>').join('');byId('puzzle').innerHTML='<span class="pill">'+c.type+'　｜　'+(step+1)+' / '+CASES.length+'</span><h2>'+c.icon+' '+c.name+'</h2><p class="intro">'+c.intro+'</p>'+c.body+'<div class="question">'+c.q+'</div>';byId('hint').className='hint'+(hint?' visible':'');byId('hint').innerHTML=hint?'<strong>💡 ヒント '+hint+' / 3</strong>'+c.hints[hint-1]:'';byId('reveal').className='reveal'+(shown?' visible':'');byId('reveal').innerHTML=shown?'<h3>🎉 答え：'+c.answer+'</h3><p>'+c.explain+'</p>':'';byId('hintBtn').textContent=hint<3?'💡 ヒント'+['①','②','③'][hint]+'を表示':'ヒントを全て表示済み';byId('hintBtn').disabled=hint>=3||shown;byId('revealBtn').disabled=shown;byId('next').disabled=!shown;byId('next').textContent=step===CASES.length-1?'🏆 ミッション達成！':'➡ 次の部屋へ';store()}function start(st){step=st;hint=0;shown=false;paint();speak()}byId('start').onclick=()=>start(0);byId('resume').onclick=()=>{step=saved.step;hint=saved.hint||0;shown=!!saved.shown;paint()};byId('speak').onclick=speak;byId('hintBtn').onclick=()=>{if(shown||hint>=3)return;hint++;paint()};byId('revealBtn').onclick=()=>{shown=true;paint();window.speechSynthesis?.cancel?.()};byId('reset').onclick=()=>{if(!confirm('最初の部屋からやり直しますか？'))return;window.speechSynthesis?.cancel?.();start(0)};byId('next').onclick=()=>{if(!shown)return;if(step===CASES.length-1){window.speechSynthesis?.cancel?.();byId('game').innerHTML='<div class="bannerEnd">🎉 脱出成功！ おめでとう！<br>ルミと5つの謎を解き明かしたよ！</div><div class="actions"><a class="btn primary" href="./">🔁 最初から遊ぶ</a><a class="btn navy" href="../saiko-apps/">他のゲームを見る</a></div>';try{localStorage.removeItem(K)}catch(e){}return;}step++;hint=0;shown=false;paint();speak()};document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!byId('game').hidden)byId('hintBtn').click()});</script></body></html>
